<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACElogic — Purchase History</title>
<style>
  :root{
    color-scheme: light;
    --page:#eef1f6; --surface:#ffffff; --ink:#1f2933; --ink2:#52606d; --muted:#7b8794; --line:#d7dbe0; --soft:#f4f6fa;
    --accent:#2f6fed; --accent-dark:#2050bd; --good:#15803d; --bad:#b91c1c; --warn:#b45309;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--page); color:var(--ink); font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap{ max-width:1180px; margin:0 auto; padding:22px 18px 80px; }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .brand{ font-weight:800; font-size:18px; letter-spacing:-.2px; }
  .brand span{ font-weight:400; color:var(--muted); }
  button, a.btn, select, input[type=text]{ font:inherit; font-size:12.5px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  button, a.btn{ font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
  button:hover, a.btn:hover{ background:var(--soft); }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover{ background:var(--accent-dark); }
  button:disabled{ opacity:.45; cursor:default; }
  .intro{ font-size:13px; color:var(--ink2); margin:-6px 0 14px; line-height:1.5; }
  .dupn{ background:#fef3c7; color:var(--warn); border-radius:999px; padding:0 7px; font-weight:700; font-size:11.5px; }
  .variant{ display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:3px 6px 3px 10px; font-size:12px; margin:0 6px 6px 0; }
  .variant button{ border:0; background:#f4f6fa; border-radius:999px; padding:2px 8px; font-size:11px; color:var(--ink2); }
  .variant button:hover{ background:#fee2e2; color:var(--bad); }
  .sugg{ display:flex; align-items:center; gap:10px; background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:12.5px; }
  .sugg .nm{ flex:1; min-width:0; } .sugg .sub{ margin:0; }
  #toast{ position:fixed; left:50%; bottom:76px; transform:translateX(-50%); background:#1f2933; color:#fff; font-size:13px; padding:10px 16px; border-radius:10px; display:none; z-index:40; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .tabs{ display:flex; gap:4px; margin-bottom:12px; }
  .tab{ border:0; background:transparent; padding:9px 16px; border-radius:8px; color:var(--ink2); font-weight:700; }
  .tab.on{ background:#fff; color:var(--accent-dark); box-shadow:0 1px 3px rgba(15,23,42,.1); }
  .filters{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .filters input[type=text]{ flex:1; min-width:220px; }
  .chk{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink2); }
  .count{ margin-left:auto; font-size:12px; color:var(--muted); }

  .sheet{ background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:clip; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{ position:sticky; top:0; z-index:2; background:#fafbfc; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700; padding:11px 12px; border-bottom:1px solid var(--line); box-shadow:0 1px 0 var(--line); }
  td{ padding:11px 12px; border-bottom:1px solid #eef0f2; vertical-align:middle; }
  tr.row{ cursor:pointer; }
  tr.row:hover{ background:#fafcff; }
  td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .iname{ font-weight:700; }
  .idesc{ color:var(--muted); font-size:12px; margin-top:1px; max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chev{ display:inline-block; color:var(--muted); transition:transform .15s; }
  .chev.open{ transform:rotate(90deg); }
  .sup{ display:inline-block; background:#eef4ff; color:var(--accent-dark); border-radius:999px; font-size:11.5px; font-weight:600; padding:2px 9px; white-space:nowrap; }
  .sub{ color:var(--muted); font-size:11.5px; margin-top:2px; }
  .badge{ display:inline-block; border-radius:999px; font-size:11.5px; font-weight:700; padding:2px 9px; white-space:nowrap; }
  .badge.best{ background:#dcfce7; color:var(--good); }
  .badge.up{ background:#fee2e2; color:var(--bad); }
  .badge.mid{ background:#fef3c7; color:var(--warn); }
  .detail td{ background:#fafbfc; padding:14px 18px 18px 40px; }
  .detail h4{ margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); }
  .cols{ display:grid; grid-template-columns:1.6fr 1fr; gap:22px; }
  table.mini{ font-size:12.5px; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  table.mini th{ position:static; box-shadow:none; background:#f4f6fa; padding:7px 10px; }
  table.mini td{ padding:7px 10px; background:#fff; }
  .actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  a.link{ color:var(--accent); text-decoration:none; }
  a.link:hover{ text-decoration:underline; }
  .empty{ text-align:center; color:var(--muted); padding:50px 16px; }
  .note{ font-size:12px; color:var(--muted); margin-top:10px; line-height:1.5; }
  .spark{ display:block; margin-top:8px; }
  .reorder-bar{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:12px 18px; display:none; align-items:center; gap:12px; justify-content:center; box-shadow:0 -6px 18px rgba(15,23,42,.08); z-index:20; }
  .reorder-bar.on{ display:flex; }
  @media(max-width:860px){ .cols{ grid-template-columns:1fr; } .hide-sm{ display:none; } .detail td{ padding-left:14px; } }
</style>
<script src="session.js"></script>
</head>
<body>
<div class="wrap">
  <div id="appbar"></div>
  <div class="pagehead">
    <div>
      <h1>Purchase History</h1>
      <div class="sub">Find what we've bought before — the price, the supplier and when. Tick an item and press <b>Add to a new requisition</b> to reorder it.</div>
    </div>
    <div class="btns"><button type="button" onclick="exportCSV()">Export CSV</button></div>
  </div>

  <div class="tabs">
    <button class="tab on" id="tab-items" onclick="setTab('items')">Items</button>
    <button class="tab" id="tab-sup" onclick="setTab('sup')">Suppliers</button>
  </div>

  <div class="filters">
    <input type="text" id="q" placeholder="Search for an item, e.g. glue, M3 screw, ABS grey" oninput="draw()">
    <select id="supplierSel" onchange="draw()"></select>
    <select id="period" onchange="draw()">
      <option value="all">All time</option>
      <option value="365">Last 12 months</option>
      <option value="180">Last 6 months</option>
      <option value="90">Last 90 days</option>
    </select>
    <select id="sort" onchange="draw()">
      <option value="recent">Sort: most recent</option>
      <option value="name">Sort: name A–Z</option>
      <option value="times">Sort: most bought</option>
      <option value="spend">Sort: highest total spend</option>
      <option value="gap">Sort: biggest price gap</option>
    </select>
    <label class="chk" title="Also show items on requisitions that are still waiting for approval or purchase"><input type="checkbox" id="incl" onchange="draw()"> Include not yet purchased</label>
    <label class="chk" id="dupWrap" style="display:none" title="Items that look similar to another item"><input type="checkbox" id="dupOnly" onchange="draw()"> Possible duplicates <span class="dupn" id="dupCount"></span></label>
    <span class="count" id="count"></span>
  </div>

  <div class="sheet"><div id="view"></div></div>
  <div class="note" id="foot"></div>
</div>

<div id="toast" role="status"></div>
<div class="reorder-bar" id="reorderBar">
  <span id="reorderText"></span>
  <button class="primary" onclick="reorderSelected()">Add to a new requisition</button>
  <button id="combineBtn" onclick="combineSelected()" title="Tell the page these are the same item" style="display:none">Combine as one item</button>
  <button onclick="clearSel()">Clear</button>
</div>

<script src="dates.js"></script>
<script src="appbar.js"></script>
<script src="supplier.js"></script>
<script src="itemmatch.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://ogxuwchojexznsxvvdhi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9neHV3Y2hvamV4em5zeHZ2ZGhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MTMyNTIsImV4cCI6MjEwMzk4OTI1Mn0.fbYPBohH22SXebXBQNoy0EoFDQeLwgKPyR3_v3r4R3U";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

AppBar.mount("appbar", {active:"items", client:supabaseClient});
const myId = sessionStorage.getItem("sl_person_id");
const myPin = sessionStorage.getItem("sl_pin");
if(!myId || !myPin){ window.location.href = "login.html?redirect=" + encodeURIComponent("items.html" + location.search); }

const BOUGHT = ["Purchased","Received"];
let RAW = [], ALIASES = [], RESOLVER = null;
let LINES = [];          // every purchased line, enriched
let tab = "items";
const openRows = new Set();
const selected = new Map(); // key -> latest line (for "Add to a new requisition")

const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const money = n => "$ " + Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
const keyOf = name => String(name||"").trim().toLowerCase().replace(/\s+/g," ");
const safeUrl = u => { const t=String(u||"").trim(); if(!t) return ""; const full=/^[a-z][a-z0-9+.-]*:\/\//i.test(t)?t:"https://"+t; return /^https?:\/\//i.test(full)?full:""; };

async function load(){
  const {data, error} = await supabaseClient.rpc("list_purchase_history", {p_person_id: myId, p_pin: myPin});
  if(error || !data || !data.success){
    document.getElementById("view").innerHTML = `<div class="empty">${esc((data&&data.error)||(error&&error.message)||"Could not load the purchase history.")}</div>`;
    return;
  }
  RAW = data.items || [];
  await loadAliases();
  buildLines();
  draw();
}
async function loadAliases(){
  try{
    const {data} = await supabaseClient.rpc("list_item_aliases", {p_person_id: myId, p_pin: myPin});
    ALIASES = (data && data.success) ? (data.aliases||[]) : [];
  }catch(_){ ALIASES = []; }
}
function buildLines(){
  RESOLVER = ItemMatch.resolver(RAW.map(i=>i.name), ALIASES);
  LINES = RAW.map(it=>{
    const sup = supplierOf(it.link);
    return {...it, qty:Number(it.qty||0), unit:Number(it.unit_price||0), delivery:Number(it.delivery_tax||0),
      key:RESOLVER.keyFor(it.name), smart:RESOLVER.smartKey(it.name), supplier:sup.name, host:sup.host, url:safeUrl(it.link),
      ts: it.item_date ? new Date(it.item_date).getTime() : 0, bought: BOUGHT.includes(it.status)};
  });
  const sups = [...new Set(LINES.map(l=>l.supplier))].sort((a,b)=>a.localeCompare(b));
  const cur = document.getElementById("supplierSel").value;
  document.getElementById("supplierSel").innerHTML = `<option value="">All suppliers</option>` + sups.map(s=>`<option>${esc(s)}</option>`).join("");
  document.getElementById("supplierSel").value = sups.includes(cur) ? cur : "";
}
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.style.display="block"; clearTimeout(window._tt); window._tt=setTimeout(()=>el.style.display="none",3500); }

function setTab(t){
  tab = t;
  document.getElementById("tab-items").classList.toggle("on", t==="items");
  document.getElementById("tab-sup").classList.toggle("on", t==="sup");
  document.getElementById("sort").style.display = t==="items" ? "" : "none";
  draw();
}

function filtered(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const sup = document.getElementById("supplierSel").value;
  const per = document.getElementById("period").value;
  const incl = document.getElementById("incl").checked;
  const since = per==="all" ? 0 : Date.now() - Number(per)*86400000;
  // the search looks at the item only (its name and description), every word must match, in any order
  const words = q.split(/\s+/).filter(Boolean);
  const hit = l => { const hay = (String(l.name||"")+" "+String(l.description||"")).toLowerCase(); return words.every(w=>hay.includes(w)); };
  return LINES.filter(l=>(incl || l.bought) && (!sup || l.supplier===sup) && l.ts >= since && (!words.length || hit(l)));
}

/* ---------- group lines into items ---------- */
function groupItems(lines){
  const m = new Map();
  lines.forEach(l=>{ if(!m.has(l.key)) m.set(l.key, []); m.get(l.key).push(l); });
  return [...m.values()].map(ls=>{
    ls.sort((a,b)=>b.ts-a.ts);                  // newest first
    const priced = ls.filter(l=>l.unit>0);
    const best = priced.length ? priced.reduce((a,b)=>b.unit<a.unit?b:a) : null;
    const avg = priced.length ? priced.reduce((a,l)=>a+l.unit*l.qty,0) / (priced.reduce((a,l)=>a+l.qty,0) || 1) : 0;   // qty-weighted average price
    const last = ls[0];
    const gap = best && last.unit>0 ? (last.unit-best.unit)/best.unit : 0;
    // the different ways people typed this item
    const vm = new Map();
    ls.forEach(l=>{ const e = vm.get(l.smart) || {smart:l.smart, names:new Map(), n:0}; e.n++; e.names.set(l.name.trim(), (e.names.get(l.name.trim())||0)+1); vm.set(l.smart,e); });
    const variants = [...vm.values()].map(e=>({smart:e.smart, n:e.n, name:[...e.names.entries()].sort((a,b)=>b[1]-a[1])[0][0]})).sort((a,b)=>b.n-a.n);
    const key = ls[0].key;
    const name = RESOLVER.canonicalName(key) || variants[0].name;
    return {key, name, desc:last.description, lines:ls, last, best, avg, gap, variants,
      times:ls.length, qty:ls.reduce((a,l)=>a+l.qty,0), spend:ls.reduce((a,l)=>a+l.unit*l.qty+l.delivery,0)};
  });
}
// other items that look a lot like this one (similar, but not already merged)
function suggestionsFor(g, groups){
  return groups.filter(h=>h.key!==g.key).map(h=>({h, sc:ItemMatch.score(g.name, h.name)})).filter(x=>x.sc>=ItemMatch.SUGGEST && x.sc<ItemMatch.AUTO).sort((a,b)=>b.sc-a.sc).slice(0,4).map(x=>x.h);
}

function draw(){
  const lines = filtered();
  document.getElementById("count").textContent = `${lines.length} purchase line${lines.length===1?"":"s"}`;
  if(tab==="items") drawItems(lines); else drawSuppliers(lines);
  document.getElementById("dupWrap").style.display = tab==="items" ? "" : "none";
  updateReorderBar();
  document.getElementById("foot").textContent = "Suppliers are worked out from each item's product link (the shop's website). Items entered without a link show as “(no link)”. Prices are per unit as entered on the requisition.";
}

function drawItems(lines){
  const sort = document.getElementById("sort").value;
  let groups = groupItems(lines);
  const dup = new Map(groups.map(g=>[g.key, suggestionsFor(g, groups)]));
  const dupN = [...dup.values()].filter(x=>x.length).length;
  document.getElementById("dupCount").textContent = dupN;
  document.getElementById("dupWrap").style.display = dupN || document.getElementById("dupOnly").checked ? "" : "none";
  if(document.getElementById("dupOnly").checked) groups = groups.filter(g=>dup.get(g.key).length);
  const cmp = {
    recent:(a,b)=>b.last.ts-a.last.ts, name:(a,b)=>a.name.localeCompare(b.name), times:(a,b)=>b.times-a.times,
    spend:(a,b)=>b.spend-a.spend, gap:(a,b)=>b.gap-a.gap }[sort];
  groups.sort(cmp);
  const view = document.getElementById("view");
  if(!groups.length){
    view.innerHTML = `<div class="empty"><b>Nothing found.</b><br>Try fewer or shorter words (for example “screw” instead of “M3 screw 10mm”),<br>clear the supplier or period filter, or tick “Include not yet purchased”.</div>`;
    return;
  }
  const kq = k => esc(k).replace(/'/g,"&#39;");
  const rows = groups.map(g=>{
    const open = openRows.has(g.key);
    const sg = dup.get(g.key) || [];
    const badge = !g.best || g.times<2 ? `<span style="color:var(--muted)">—</span>`
      : g.gap<=0.005 ? `<span class="badge best" title="You paid the lowest price we've seen">Best price</span>`
      : `<span class="badge ${g.gap>0.1?"up":"mid"}" title="Last price compared with the cheapest we've paid">+${(g.gap*100).toFixed(0)}% vs cheapest</span>`;
    const extra = [`bought ${g.times}×`, g.variants.length>1 ? `${g.variants.length} name variants` : "", sg.length ? `<span style="color:var(--warn)">possible duplicate</span>` : ""].filter(Boolean).join(" · ");
    const main = `<tr class="row" onclick="toggle('${kq(g.key)}')">
      <td style="width:34px" onclick="event.stopPropagation()"><input type="checkbox" ${selected.has(g.key)?"checked":""} onchange="pick('${kq(g.key)}',this.checked)" aria-label="Select ${esc(g.name)}"></td>
      <td><div class="iname">${esc(g.name)}</div><div class="sub">${extra}</div></td>
      <td class="hide-sm">${esc(fmtDMY(g.last.item_date))}<div class="sub">qty ${g.last.qty}</div></td>
      <td class="num"><b>${money(g.last.unit)}</b><div class="sub"><span class="sup">${esc(g.last.supplier)}</span></div></td>
      <td class="num hide-sm">${g.best?money(g.best.unit):"—"}${g.best?`<div class="sub">${esc(g.best.supplier)}</div>`:""}</td>
      <td>${badge}</td>
      <td class="num" onclick="event.stopPropagation()"><button onclick="reorderOne('${kq(g.key)}')" title="Add this item to a new requisition">Add to requisition</button></td>
      <td style="width:22px"><span class="chev ${open?"open":""}">›</span></td></tr>`;
    return main + (open ? `<tr class="detail"><td colspan="8">${detailHtml(g, sg)}</td></tr>` : "");
  }).join("");
  view.innerHTML = `<table><thead><tr><th></th><th>Item</th><th class="hide-sm">Last bought</th><th class="num">Last price</th><th class="num hide-sm">Cheapest paid</th><th>Price check</th><th></th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function detailHtml(g, sg){
  // price by supplier
  const bySup = new Map();
  g.lines.forEach(l=>{ const e = bySup.get(l.supplier) || {n:0, qty:0, cost:0, last:l, min:l.unit||Infinity}; e.n++; e.qty+=l.qty; e.cost+=l.unit*l.qty; if(l.unit>0) e.min=Math.min(e.min,l.unit); bySup.set(l.supplier,e); });
  const supRows = [...bySup.entries()].sort((a,b)=>(a[1].cost/(a[1].qty||1))-(b[1].cost/(b[1].qty||1))).map(([s,e])=>
    `<tr><td><span class="sup">${esc(s)}</span></td><td class="num">${e.n}</td><td class="num">${money(e.qty?e.cost/e.qty:0)}</td><td class="num">${money(e.last.unit)}</td><td class="num">${isFinite(e.min)?money(e.min):"—"}</td></tr>`).join("");
  const lineRows = g.lines.map(l=>`<tr>
    <td>${esc(fmtDMY(l.item_date))}</td>
    <td><a class="link" href="view.html?id=${esc(l.requisition_id)}">${esc(l.tracking_no||"")}</a></td>
    <td>${l.url?`<a class="link" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.supplier)} ↗</a>`:`<span class="sub">${esc(l.supplier)}</span>`}</td>
    <td class="num">${l.qty}</td><td class="num">${money(l.unit)}</td><td class="num hide-sm">${money(l.delivery)}</td>
    <td class="hide-sm">${esc(l.project_name||"")}</td><td class="hide-sm">${esc(l.request_by||"")}</td>${BOUGHT.includes(l.status)?"<td></td>":`<td><span class="sub">${esc(l.status)}</span></td>`}</tr>`).join("");
  const spark = sparkline(g.lines.filter(l=>l.unit>0).slice().reverse());
  const kq = k => esc(k).replace(/'/g,"&#39;");
  const variantHtml = g.variants.length>1 ? `<h4 style="margin-top:14px">Names people used for this item</h4><div>${g.variants.map(v=>`<span class="variant">${esc(v.name)} <span class="sub" style="margin:0">${v.n}×</span><button onclick="separate('${kq(v.smart)}','${kq(v.name)}')" title="This is a different item — keep it separate">Not the same</button></span>`).join("")}</div>` : "";
  const suggHtml = sg && sg.length ? `<h4 style="margin-top:14px">Could be the same item?</h4>${sg.map(h=>`<div class="sugg"><div class="nm"><b>${esc(h.name)}</b><div class="sub">bought ${h.times}× · last ${money(h.last.unit)} at ${esc(h.last.supplier)}</div></div><button class="primary" onclick="combineTwo('${kq(g.key)}','${kq(h.key)}')">Yes, combine</button></div>`).join("")}` : "";
  return `<div class="cols">
    <div><h4>Every purchase</h4><table class="mini"><thead><tr><th>Date</th><th>REQ</th><th>Supplier</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num hide-sm">Delivery</th><th class="hide-sm">Project</th><th class="hide-sm">By</th><th></th></tr></thead><tbody>${lineRows}</tbody></table></div>
    <div><h4>Price by supplier</h4><table class="mini"><thead><tr><th>Supplier</th><th class="num">Buys</th><th class="num">Avg</th><th class="num">Last</th><th class="num">Lowest</th></tr></thead><tbody>${supRows}</tbody></table>${spark}
      <div class="sub" style="margin-top:6px">Average is weighted by quantity. Cheapest supplier first.</div></div>
  </div>
  ${variantHtml}${suggHtml}
  <div class="actions"><button class="primary" onclick="reorderOne('${esc(g.key).replace(/'/g,"&#39;")}')">Add to a new requisition</button>
    ${g.last.url?`<a class="btn" href="${esc(g.last.url)}" target="_blank" rel="noopener">Open last product link ↗</a>`:""}
    ${g.best && g.best.url?`<a class="btn" href="${esc(g.best.url)}" target="_blank" rel="noopener">Open best-price link ↗</a>`:""}</div>`;
}

// tiny price-over-time line (oldest -> newest)
function sparkline(ls){
  if(ls.length<2) return "";
  const W=260,H=54,p=6, vals=ls.map(l=>l.unit), mn=Math.min(...vals), mx=Math.max(...vals), rng=(mx-mn)||1;
  const pts = vals.map((v,i)=>[p+i*(W-2*p)/(vals.length-1), H-p-(v-mn)/rng*(H-2*p)]);
  const d = pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ");
  const first=vals[0], lastv=vals[vals.length-1], chg=first? (lastv-first)/first*100 : 0;
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Unit price over time, ${money(first)} to ${money(lastv)}"><path d="${d}" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="4" fill="#2a78d6" stroke="#fff" stroke-width="2"/></svg>
    <div class="sub">Price trend: ${money(first)} → ${money(lastv)} (${chg>=0?"+":""}${chg.toFixed(0)}%)</div>`;
}

function drawSuppliers(lines){
  const m = new Map();
  lines.forEach(l=>{ const e = m.get(l.supplier) || {name:l.supplier, host:l.host, lines:[], items:new Set(), spend:0, last:0}; e.lines.push(l); e.items.add(l.key); e.spend += l.unit*l.qty+l.delivery; e.last=Math.max(e.last,l.ts); m.set(l.supplier,e); });
  const list = [...m.values()].sort((a,b)=>b.spend-a.spend);
  const view = document.getElementById("view");
  if(!list.length){ view.innerHTML = `<div class="empty">Nothing matches.</div>`; return; }
  const total = list.reduce((a,e)=>a+e.spend,0) || 1;
  const rows = list.map(e=>{
    const k = "sup:"+e.name, open = openRows.has(k);
    const main = `<tr class="row" onclick="toggle('${esc(k).replace(/'/g,"&#39;")}')"><td><span class="sup">${esc(e.name)}</span>${e.host?`<div class="sub">${esc(e.host)}</div>`:""}</td>
      <td class="num">${e.items.size}</td><td class="num">${e.lines.length}</td><td class="num"><b>${money(e.spend)}</b><div class="sub">${(e.spend/total*100).toFixed(0)}% of spend</div></td>
      <td class="hide-sm">${esc(fmtDMY(new Date(e.last).toISOString().slice(0,10)))}</td><td style="width:26px"><span class="chev ${open?"open":""}">›</span></td></tr>`;
    let detail = "";
    if(open){
      const gs = groupItems(e.lines).sort((a,b)=>b.spend-a.spend);
      detail = `<tr class="detail"><td colspan="6"><h4>Items bought from ${esc(e.name)}</h4><table class="mini"><thead><tr><th>Item</th><th class="num">Bought</th><th class="num">Last price</th><th class="num">Spend</th><th>Last bought</th></tr></thead><tbody>${gs.map(g=>`<tr><td>${esc(g.name)}</td><td class="num">${g.times}×</td><td class="num">${money(g.last.unit)}</td><td class="num">${money(g.spend)}</td><td>${esc(fmtDMY(g.last.item_date))}</td></tr>`).join("")}</tbody></table></td></tr>`;
    }
    return main+detail;
  }).join("");
  view.innerHTML = `<table><thead><tr><th>Supplier</th><th class="num">Different items</th><th class="num">Purchases</th><th class="num">Total spend</th><th class="hide-sm">Last used</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function toggle(k){ if(openRows.has(k)) openRows.delete(k); else openRows.add(k); draw(); }

/* ---------- combine / separate (shared with everyone via item_aliases) ---------- */
async function saveAliases(rows){
  const {data, error} = await supabaseClient.rpc("set_item_aliases", {p_person_id: myId, p_pin: myPin, p_rows: rows});
  if(error || !data || !data.success){ toast((data&&data.error)||(error&&error.message)||"Could not save that."); return false; }
  await loadAliases(); buildLines(); return true;
}
function groupNow(key){ return groupItems(LINES).find(g=>g.key===key); }   // every purchase, ignoring the filters
function groupVisible(key){ return groupItems(filtered().filter(l=>l.key===key))[0]; }   // only what the filters show
async function combineGroups(groups, name){
  const target = groups[0], rows = [];
  groups.forEach(g=>g.variants.forEach(v=>rows.push({member_key:v.smart, canonical_key:target.key, canonical_name:name})));
  rows.push({member_key:target.key, canonical_key:target.key, canonical_name:name});
  if(await saveAliases(rows)){ selected.clear(); draw(); toast(`Combined into “${name}”. Everyone now sees them as one item.`); }
}
async function combineTwo(aKey, bKey){
  const a = groupNow(aKey), b = groupNow(bKey); if(!a||!b) return;
  await combineGroups([a,b], a.name);
}
async function combineSelected(){
  const gs = [...selected.keys()].map(groupNow).filter(Boolean); if(gs.length<2) return;
  const name = (window.prompt("These will be treated as one item from now on, for everyone.\n\nName to show for the combined item:", gs[0].name)||"").trim();
  if(!name) return;
  await combineGroups(gs, name);
}
async function separate(smart, name){
  if(!await saveAliases([{member_key:smart, canonical_key:smart, canonical_name:name}])) return;
  draw(); toast(`“${name}” is now kept as its own item.`);
}

/* ---------- reorder: hand the chosen items to the requisition form ---------- */
function pick(key, on){
  if(on){ const g = groupVisible(key); if(g) selected.set(key, g); } else selected.delete(key);
  updateReorderBar();
}
function clearSel(){ selected.clear(); draw(); }
function updateReorderBar(){
  const bar = document.getElementById("reorderBar");
  bar.classList.toggle("on", selected.size>0);
  document.getElementById("combineBtn").style.display = selected.size>1 ? "" : "none";
  document.getElementById("reorderText").textContent = `${selected.size} item${selected.size===1?"":"s"} selected`;
}
function sendToForm(groups){
  const payload = groups.map(g=>({name:g.name, description:g.desc||"", qty:g.last.qty||1, unit_price:g.last.unit, delivery_tax:0, link:g.last.link||""}));
  try{ localStorage.setItem("sl_reorder", JSON.stringify(payload)); }catch(_){ alert("Your browser is blocking local storage, so the items can't be passed to the form."); return; }
  window.location.href = "index.html?reorder=1";
}
function reorderSelected(){ sendToForm([...selected.keys()].map(groupVisible).filter(Boolean)); }
function reorderOne(key){ const g = groupVisible(key); if(g) sendToForm([g]); }

function exportCSV(){
  const lines = filtered();
  const head = ["Item","Description","Supplier","Product link","Date","REQ no.","Qty","Unit price","Delivery/Tax","Line total","Project","Requested by","Status"];
  const rows = lines.map(l=>[l.name,l.description||"",l.supplier,l.link||"",fmtDMY(l.item_date),l.tracking_no||"",l.qty,l.unit.toFixed(2),l.delivery.toFixed(2),(l.unit*l.qty+l.delivery).toFixed(2),l.project_name||"",l.request_by||"",l.status]);
  const csv = [head,...rows].map(r=>r.map(x=>`"${String(x==null?"":x).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));   // BOM: Chinese text opens correctly in Excel
  a.download = "purchase_history.csv"; a.click(); URL.revokeObjectURL(a.href);
}

{ const pre = new URLSearchParams(location.search).get("q"); if(pre) document.getElementById("q").value = pre; }   // opened from the assistant: search is pre-filled
if(myId && myPin){ setTab("items"); load(); }
