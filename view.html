<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACElogic — View Requisition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2933; --muted:#6b7280; --line:#d7dbe0; --accent:#2f6fed; --accent-dark:#2050bd;
    --bg:#eef1f6; --paper:#ffffff; --success:#16a34a; --danger:#dc2626; --pending:#94a3b8;
  }
  *{box-sizing:border-box}
  body{ margin:0; font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  .wrap{ max-width:900px; margin:24px auto 60px; padding:0 16px; }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .brand{ font-weight:800; font-size:16px; }
  .brand span{ font-weight:400; color:var(--muted); }
  button, a.btn{ border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 14px; border-radius:8px; cursor:pointer; font:inherit; font-weight:600; font-size:12.5px; text-decoration:none; display:inline-block; }
  .view-tag{ font-size:11px; font-weight:700; color:var(--muted); background:#eef1f6; border:1px solid var(--line); padding:5px 10px; border-radius:999px; }

  .sheet{ background:var(--paper); border-radius:14px; box-shadow:0 8px 24px rgba(15,23,42,.07); padding:30px; }
  .form-header{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:18px; }
  .form-title{ font-size:20px; font-weight:800; }
  .form-sub{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:2px; }
  .status-pill{ display:inline-block; padding:6px 14px; border-radius:999px; font-size:12px; font-weight:700; color:#fff; }

  .meta-grid{ display:grid; grid-template-columns:1fr 1fr; gap:4px 30px; margin-bottom:22px; font-size:13px; }
  .meta-row{ display:flex; justify-content:space-between; border-bottom:1px dotted var(--line); padding:5px 0; }
  .meta-row .k{ color:var(--muted); font-weight:600; }
  .meta-row .v{ font-weight:600; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:22px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; color:var(--muted); border-bottom:2px solid var(--ink); padding:6px 8px; }
  td{ padding:8px; border-bottom:1px solid var(--line); }
  td.num, th.num{ text-align:right; }
  tfoot td{ font-weight:700; border-bottom:none; padding-top:8px; }

  .sign-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .sign-card{ border:1.5px solid var(--line); border-radius:10px; padding:14px; }
  .sign-role{ font-size:11px; font-weight:700; text-transform:uppercase; color:var(--muted); letter-spacing:.4px; margin-bottom:8px; }
  .sign-name{ font-size:15px; font-weight:700; margin-bottom:4px; }
  .sign-status{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; color:#fff; }
  .sign-status.signed{ background:var(--success); }
  .sign-status.pending{ background:var(--pending); }
  .sign-status.declined{ background:var(--danger); }
  .sign-meta{ font-size:11.5px; color:var(--muted); margin-top:6px; }
  .decline-box{ font-size:11.5px; color:var(--danger); background:#fef2f2; border:1px solid #fecaca; border-radius:6px; padding:6px 8px; margin-top:6px; }
  .override-tag{ font-size:10.5px; color:#7c3aed; font-style:italic; margin-top:4px; }
  .center-note{ text-align:center; color:var(--muted); padding:60px 0; }
  @media(max-width:640px){ .meta-grid,.sign-grid{ grid-template-columns:1fr; } }
  @media print{
    body{ background:#fff; }
    .toolbar{ display:none!important; }
    .wrap{ max-width:none; margin:0; padding:0; }
    .sheet{ box-shadow:none; border-radius:0; padding:0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <div class="brand">SPACE<span>logic</span></div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="view-tag">👁 View only — no editing here</span>
      <button class="btn" onclick="window.print()">🖨 Print</button>
      <button class="btn" onclick="exportPDF()">⬇ Export PDF</button>
      <a class="btn" href="dashboard.html">← Back to Dashboard</a>
    </div>
  </div>
  <div class="sheet" id="content"><div class="center-note">Loading...</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://ogxuwchojexznsxvvdhi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9neHV3Y2hvamV4em5zeHZ2ZGhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MTMyNTIsImV4cCI6MjEwMzk4OTI1Mn0.fbYPBohH22SXebXBQNoy0EoFDQeLwgKPyR3_v3r4R3U";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STAGE_VARS = { "Submitted":"#94a3b8","Manager Approved":"#f59e0b","Procurement Approved":"#8b5cf6","Purchased":"#2f6fed","Received":"#16a34a","Declined":"#dc2626" };

function escHtml(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function money(n){ return "$ "+Number(n||0).toFixed(2); }

let myId=null, myPin=null;

async function init(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const content = document.getElementById("content");
  if(!id){ content.innerHTML = '<div class="center-note">No requisition specified.</div>'; return; }

  myId = sessionStorage.getItem("sl_person_id");
  myPin = sessionStorage.getItem("sl_pin");
  if(!myId || !myPin){
    const {data: people} = await supabaseClient.from("people_public").select("id,name").order("name");
    viewPeopleCache = people || [];
    content.innerHTML = `
      <div style="max-width:340px;margin:20px auto;text-align:center">
        <h3 style="margin-bottom:6px">Sign in to view this form</h3>
        <div class="center-note" style="padding:0 0 14px">Only people involved in this requisition can view it. New here? Just type your name and choose a PIN.</div>
        <input type="text" id="viewNameInput" list="viewPeopleList" placeholder="Your name" autocomplete="off" oninput="toggleViewConfirmPin()" style="width:100%;margin-bottom:8px;padding:9px;border:1px solid var(--line);border-radius:8px">
        <datalist id="viewPeopleList">${viewPeopleCache.map(p=>`<option value="${escHtml(p.name)}">`).join("")}</datalist>
        <input type="password" id="viewPinInput" placeholder="PIN" maxlength="4" inputmode="numeric" style="width:100%;margin-bottom:8px;padding:9px;border:1px solid var(--line);border-radius:8px">
        <div id="viewConfirmPinWrap" style="display:none">
          <input type="password" id="viewConfirmPinInput" placeholder="Confirm new PIN" maxlength="4" inputmode="numeric" style="width:100%;margin-bottom:8px;padding:9px;border:1px solid var(--line);border-radius:8px">
        </div>
        <button class="btn" onclick="viewLogin('${id}')" style="width:100%;background:var(--accent);color:#fff;border-color:var(--accent)">Continue</button>
        <div class="decline-box" id="viewLoginErr" style="display:none;margin-top:10px"></div>
      </div>`;
    return;
  }

  await loadRequisition(id);
}

let viewPeopleCache = [];

function toggleViewConfirmPin(){
  const name = document.getElementById("viewNameInput").value.trim().toLowerCase();
  const wrap = document.getElementById("viewConfirmPinWrap");
  const isNew = name && !viewPeopleCache.some(p=>p.name.toLowerCase()===name);
  wrap.style.display = isNew ? "block" : "none";
}

async function viewLogin(id){
  const name = document.getElementById("viewNameInput").value.trim();
  const pin = document.getElementById("viewPinInput").value.trim();
  const errEl = document.getElementById("viewLoginErr");
  if(!name || !/^\d{4}$/.test(pin)){ errEl.style.display="block"; errEl.textContent="Enter your name and 4-digit PIN."; return; }

  const existing = viewPeopleCache.find(p=>p.name.toLowerCase()===name.toLowerCase());
  let personId, resolvedName;

  if(existing){
    const {data, error} = await supabaseClient.rpc("login_person", {p_person_id: existing.id, p_pin: pin});
    if(error || !data.success){ errEl.style.display="block"; errEl.textContent=(data&&data.error)||"Login failed."; return; }
    personId = data.id; resolvedName = data.name;
  } else {
    const confirmPin = document.getElementById("viewConfirmPinInput").value.trim();
    if(pin !== confirmPin){ errEl.style.display="block"; errEl.textContent="PINs don't match — re-enter both."; return; }
    const {data, error} = await supabaseClient.rpc("register_person", {p_name: name, p_pin: pin});
    if(error || !data.success){ errEl.style.display="block"; errEl.textContent=(data&&data.error)||"Could not register."; return; }
    personId = data.id; resolvedName = data.name;
  }

  myId = personId; myPin = pin;
  sessionStorage.setItem("sl_person_id", myId);
  sessionStorage.setItem("sl_person_name", resolvedName);
  sessionStorage.setItem("sl_pin", myPin);
  await loadRequisition(id);
}

async function loadRequisition(id){
  const content = document.getElementById("content");
  const {data, error} = await supabaseClient.rpc("get_requisition_for_viewer", {p_person_id: myId, p_pin: myPin, p_requisition_id: id});
  if(error || !data.success){ content.innerHTML = `<div class="center-note">${escHtml((data&&data.error)||"Could not load this requisition.")}</div>`; return; }
  render(data.requisition);
}

function signCard(step){
  if(!step) return '<div class="sign-card"><div class="sign-status pending">Not assigned</div></div>';
  let statusHtml, metaHtml="", declineHtml="", overrideHtml="";
  if(step.status==="Signed"){
    statusHtml = `<span class="sign-status signed">✓ Signed</span>`;
    metaHtml = `<div class="sign-meta">${new Date(step.signed_at).toLocaleString()}</div>`;
    if(step.is_override) overrideHtml = `<div class="override-tag">Fast-forwarded by admin (${escHtml(step.override_by)})</div>`;
  } else if(step.status==="Declined"){
    statusHtml = `<span class="sign-status declined">✕ Declined</span>`;
    metaHtml = `<div class="sign-meta">${new Date(step.declined_at).toLocaleString()}</div>`;
    declineHtml = `<div class="decline-box">Reason: ${escHtml(step.decline_reason||"—")}</div>`;
  } else {
    statusHtml = `<span class="sign-status pending">Pending</span>`;
  }
  return `
    <div class="sign-card">
      <div class="sign-role">${escHtml(step.stage_name)}</div>
      <div class="sign-name">${escHtml(step.assigned_person_name||"—")}</div>
      ${statusHtml}
      ${metaHtml}
      ${declineHtml}
      ${overrideHtml}
    </div>`;
}

let currentReq = null;

function render(req){
  currentReq = req;
  const items = (req.requisition_items||[]).slice().sort((a,b)=>(a.sn||0)-(b.sn||0));
  const steps = (req.approval_steps||[]).slice().sort((a,b)=>a.step_order-b.step_order);
  const byOrder = {}; steps.forEach(s=>byOrder[s.step_order]=s);

  const itemRows = items.map(it=>`
    <tr>
      <td>${it.sn}</td>
      <td>${escHtml(it.name)}${it.link?` — <a href="${escHtml(it.link)}" target="_blank">link ↗</a>`:""}</td>
      <td>${escHtml(it.description)}</td>
      <td class="num">${it.qty}</td>
      <td class="num">${money(it.unit_price)}</td>
      <td class="num">${money(it.delivery_tax)}</td>
      <td class="num">${money(it.total)}</td>
    </tr>`).join("");

  document.getElementById("content").innerHTML = `
    <div class="form-header">
      <div>
        <div class="form-title">${escHtml(req.project_name||"Untitled Project")}</div>
        <div class="form-sub">Materials Requisition — ${escHtml(req.tracking_no)}</div>
      </div>
      <span class="status-pill" style="background:${STAGE_VARS[req.status]||'#94a3b8'}">${escHtml(req.status)}</span>
    </div>

    ${req.status==="Declined" ? `<div class="decline-box" style="margin-bottom:16px">Declined by ${escHtml(req.declined_by)} on ${req.declined_at?new Date(req.declined_at).toLocaleString():""} — Reason: ${escHtml(req.decline_reason||"—")}</div>` : ""}

    <div class="meta-grid">
      <div class="meta-row"><span class="k">Project Location</span><span class="v">${escHtml(req.project_location||"-")}</span></div>
      <div class="meta-row"><span class="k">Requested By</span><span class="v">${escHtml(req.request_by||"-")}</span></div>
      <div class="meta-row"><span class="k">Form Date</span><span class="v">${escHtml(req.form_date||"-")}</span></div>
      <div class="meta-row"><span class="k">Supply Date</span><span class="v">${escHtml(req.supply_date||"-")}</span></div>
      <div class="meta-row"><span class="k">PC No.</span><span class="v">${escHtml(req.pc_no||"-")}</span></div>
      <div class="meta-row"><span class="k">PM In-Charge</span><span class="v">${escHtml(req.pm_incharge||"-")}</span></div>
    </div>

    <table>
      <thead><tr><th>S/N</th><th>Name</th><th>Description</th><th class="num">Qty</th><th class="num">Unit Price</th><th class="num">Delv/Tax</th><th class="num">Total</th></tr></thead>
      <tbody>${itemRows || '<tr><td colspan="7" style="text-align:center;color:var(--muted)">No line items</td></tr>'}</tbody>
      <tfoot>
        <tr><td colspan="6">Materials Subtotal</td><td class="num">${money(req.materials_subtotal)}</td></tr>
        <tr><td colspan="6">Delivery / Tax Subtotal</td><td class="num">${money(req.delivery_tax_subtotal)}</td></tr>
        <tr><td colspan="6">GRAND TOTAL</td><td class="num">${money(req.grand_total)}</td></tr>
      </tfoot>
    </table>

    <div class="sign-grid">
      ${signCard(byOrder[1])}
      ${signCard(byOrder[2])}
      ${signCard(byOrder[3])}
      ${signCard(byOrder[4])}
    </div>
  `;
}

function exportPDF(){
  if(!currentReq){ alert("Nothing loaded yet."); return; }
  const req = currentReq;
  const items = (req.requisition_items||[]).slice().sort((a,b)=>(a.sn||0)-(b.sn||0));
  const steps = (req.approval_steps||[]).slice().sort((a,b)=>a.step_order-b.step_order);

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "portrait", unit: "pt", format: "a4" });
  const margin = 40;
  let y = margin;

  doc.setFont("helvetica","bold"); doc.setFontSize(16);
  doc.text(req.project_name || "Untitled Project", margin, y); y += 18;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(100);
  doc.text(`Materials Requisition — ${req.tracking_no}  ·  Status: ${req.status}`, margin, y); y += 22;
  doc.setTextColor(0);

  const metaRows = [
    ["Project Location", req.project_location||"-", "Requested By", req.request_by||"-"],
    ["Form Date", req.form_date||"-", "Supply Date", req.supply_date||"-"],
    ["PC No.", req.pc_no||"-", "PM In-Charge", req.pm_incharge||"-"]
  ];
  doc.autoTable({
    startY: y, theme: "plain", styles:{fontSize:9, cellPadding:2},
    body: metaRows.map(r=>[{content:r[0],styles:{fontStyle:"bold",textColor:100}},r[1],{content:r[2],styles:{fontStyle:"bold",textColor:100}},r[3]]),
    margin: {left: margin, right: margin}
  });
  y = doc.lastAutoTable.finalY + 14;

  if(req.status === "Declined"){
    doc.setFillColor(254,242,242); doc.setDrawColor(252,165,165);
    doc.rect(margin, y, 515, 32, "FD");
    doc.setFontSize(9); doc.setTextColor(153,27,27);
    doc.text(`Declined by ${req.declined_by||""} — Reason: ${req.decline_reason||""}`, margin+8, y+20, {maxWidth:500});
    doc.setTextColor(0);
    y += 44;
  }

  doc.autoTable({
    startY: y,
    head: [["S/N","Name","Description","Qty","Unit Price","Delv/Tax","Total"]],
    body: items.map(it=>[it.sn, it.name, it.description||"", it.qty, `$${Number(it.unit_price).toFixed(2)}`, `$${Number(it.delivery_tax).toFixed(2)}`, `$${Number(it.total).toFixed(2)}`]),
    foot: [
      ["","","","","","Materials Subtotal", `$${Number(req.materials_subtotal).toFixed(2)}`],
      ["","","","","","Delivery/Tax Subtotal", `$${Number(req.delivery_tax_subtotal).toFixed(2)}`],
      ["","","","","","GRAND TOTAL", `$${Number(req.grand_total).toFixed(2)}`]
    ],
    styles:{fontSize:9}, headStyles:{fillColor:[31,41,51]}, margin:{left:margin,right:margin}
  });
  y = doc.lastAutoTable.finalY + 20;

  doc.setFont("helvetica","bold"); doc.setFontSize(11);
  doc.text("Approval Chain", margin, y); y += 14;
  doc.setFont("helvetica","normal");

  steps.forEach(s=>{
    if(y > 760){ doc.addPage(); y = margin; }
    let statusText = "Pending";
    if(s.status==="Signed") statusText = `Signed by ${s.assigned_person_name} on ${new Date(s.signed_at).toLocaleDateString()}`;
    else if(s.status==="Declined") statusText = `Declined by ${s.assigned_person_name} — ${s.decline_reason||""}`;
    doc.setFontSize(9); doc.setFont("helvetica","bold");
    doc.text(`${s.stage_name}:`, margin, y);
    doc.setFont("helvetica","normal");
    doc.text(statusText, margin+110, y, {maxWidth:400});
    y += 16;
  });

  doc.setFontSize(7); doc.setTextColor(150);
  doc.text(`Exported ${new Date().toLocaleString()} from SPACElogic MR Tracker`, margin, 820);

  doc.save(`${req.tracking_no}_${(req.project_name||"requisition").replace(/[^a-z0-9]/gi,"_")}.pdf`);
}

init();
</script>
</body>
</html>
