<!DOCTYPE html>
<html lang="en" data-theme-ok>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACElogic — View Requisition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2933; --muted:#6b7280; --line:#d7dbe0; --accent:#2f6fed; --accent-dark:#2050bd;
    --bg:#eef1f6; --paper:#ffffff; --success:#16a34a; --danger:#dc2626; --pending:#94a3b8;
  }
  *{box-sizing:border-box}
  body{ margin:0; font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  .wrap{ max-width:1000px; margin:24px auto 60px; padding:0 16px; }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .brand{ font-weight:800; font-size:16px; }
  .brand span{ font-weight:400; color:var(--muted); }
  button, a.btn{ border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 14px; border-radius:8px; cursor:pointer; font:inherit; font-weight:600; font-size:12.5px; text-decoration:none; display:inline-block; }
  .view-tag{ font-size:11px; font-weight:700; color:var(--muted); background:#eef1f6; border:1px solid var(--line); padding:5px 10px; border-radius:999px; }

  .sheet{ max-width:900px; margin-left:auto; margin-right:auto; background:var(--paper); border-radius:14px; box-shadow:0 8px 24px rgba(15,23,42,.07); padding:30px; }
  .form-header{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:18px; }
  .form-title{ font-size:20px; font-weight:800; }
  .form-sub{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:2px; }
  .status-pill{ display:inline-block; padding:6px 14px; border-radius:999px; font-size:12px; font-weight:700; color:#fff; }

  .meta-grid{ display:grid; grid-template-columns:1fr 1fr; gap:4px 30px; margin-bottom:22px; font-size:13px; }
  .meta-row{ display:flex; justify-content:space-between; border-bottom:1px dotted var(--line); padding:5px 0; }
  .meta-row .k{ color:var(--muted); font-weight:600; }
  .meta-row .v{ font-weight:600; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:22px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; color:var(--muted); border-bottom:2px solid var(--ink); padding:6px 8px; }
  td{ padding:8px; border-bottom:1px solid var(--line); }
  td.num, th.num{ text-align:right; }
  tfoot td{ font-weight:700; border-bottom:none; padding-top:8px; }

  .action-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:10px 12px; margin:0 0 20px; background:#f8fafc; border:1px solid var(--line); border-radius:10px; }
  .ab-group{ display:flex; flex-wrap:wrap; gap:6px; }
  .ab-sep{ width:1px; height:24px; background:var(--line); margin:0 4px; }
  .ab-spacer{ flex:1; }
  .action-bar button, .action-bar a.btn{ padding:7px 12px; }
  .action-bar .btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .action-bar .btn-primary:hover{ background:#2050bd; }
  .action-bar .btn-danger{ color:var(--danger); border-color:#fecaca; background:#fff; }
  .action-bar .btn-danger:hover{ background:#fef2f2; }
  .action-bar .ab-del{ margin-left:6px; padding-left:14px; border-left:1px solid var(--line); }
  .action-bar .btn-danger.del{ background:#fef2f2; border-color:#f87171; font-weight:700; }
  .actions-msg{ font-size:12px; color:var(--accent); min-height:16px; margin:-12px 0 12px; }
  @media(max-width:640px){ .ab-sep{ display:none; } .ab-spacer{ display:none; } }
  /* phones: the action buttons share a tidy two-column grid instead of one button per line */
  @media(max-width:720px){
    .action-bar{ display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px; margin-bottom:14px; }
    .action-bar .ab-group{ display:contents; }
    .action-bar button, .action-bar a.btn{ width:100%; padding:9px 6px; font-size:12.5px; margin:0; }
    .action-bar .ab-del{ margin:0; padding-left:6px; border-left:0; }
    .action-bar > *:only-child, .action-bar a{ grid-column:auto; }
  }
  .authnote{ margin:0 0 12px; padding:10px 12px; border:1.5px solid #bcd0fa; background:#eef4ff; border-radius:10px; font-size:12.5px; line-height:1.5; }
  .sign-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .sign-card{ border:1.5px solid var(--line); border-radius:10px; padding:14px; }
  .sign-role{ font-size:11px; font-weight:700; text-transform:uppercase; color:var(--muted); letter-spacing:.4px; margin-bottom:8px; }
  .sign-name{ font-size:15px; font-weight:700; margin-bottom:4px; }
  .sign-status{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; color:#fff; }
  .sign-status.signed{ background:var(--success); }
  .sign-status.pending{ background:var(--pending); }
  .sign-status.declined{ background:var(--danger); }
  .sign-meta{ font-size:11.5px; color:var(--muted); margin-top:6px; }
  .decline-box{ font-size:11.5px; color:var(--danger); background:#fef2f2; border:1px solid #fecaca; border-radius:6px; padding:6px 8px; margin-top:6px; }
  .override-tag{ font-size:10.5px; color:#7c3aed; font-style:italic; margin-top:4px; }
  .center-note{ text-align:center; color:var(--muted); padding:60px 0; }
  
  @media print{
    body{ background:#fff; }
    .toolbar,.action-bar,.actions-msg{ display:none!important; }
    .wrap{ max-width:none; margin:0; padding:0; }
    .sheet{ box-shadow:none; border-radius:0; padding:0; }
  }

  @media (max-width:720px){
    table{ display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    /* phones: every item is a card, so nothing is cut off or needs sideways scrolling */
    table.items-t{ overflow:visible; }
    .items-t thead{ display:none; }
    .items-t, .items-t tbody, .items-t tfoot{ display:block; width:100%; }
    .items-t tr.itm{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px 10px; padding:11px 12px; margin-bottom:9px; border:1px solid var(--line); border-radius:12px; background:var(--paper,#fff); }
    .items-t tr.itm td{ display:block; padding:0; border:0; text-align:left; min-width:0; }
    .items-t td.c-sn{ grid-column:1; font-size:11px; font-weight:800; color:var(--muted); }
    .items-t td.c-sn::before{ content:"Item "; }
    .items-t td.c-nm{ grid-column:1/-1; font-weight:800; font-size:14px; }
    .items-t td.c-ds{ grid-column:1/-1; color:var(--muted); font-size:12.5px; }
    .items-t td.c-ds:empty{ display:none; }
    .items-t td[data-l]::before{ content:attr(data-l); display:block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin-bottom:1px; }
    .items-t td.c-t{ grid-column:1/-1; display:flex !important; justify-content:space-between; align-items:baseline; border-top:1px dashed var(--line) !important; padding-top:7px !important; font-weight:800; font-size:14px; }
    .items-t td.c-t::before{ margin:0; }
    .items-t tr.itm td.c-sn{ order:-1; }
    .items-t tfoot tr{ display:flex; justify-content:space-between; padding:5px 4px; }
    .items-t tfoot td{ display:block; padding:0; border:0; }
    .items-t tfoot td[colspan]{ flex:1; }
    .items-t tfoot tr:last-child{ border-top:2px solid var(--ink); margin-top:4px; padding-top:8px; font-size:15px; }
    .meta-grid{ grid-template-columns:1fr; }
  }
  .inc-lbl{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:#4b5563; white-space:nowrap; } .inc-lbl input{ margin:0; }
  .turn-bar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:0 0 14px; padding:12px 14px; background:#eff6ff; border:1.5px solid #93c5fd; border-radius:12px; }
  .turn-bar b{ display:block; color:#1e40af; font-size:14.5px; } .turn-bar span{ font-size:12.5px; color:#1e3a8a; }
  .mark-btn{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:800; padding:10px 18px; font-size:14px; border-radius:10px; }
  .mark-btn.small{ display:block; margin-top:8px; padding:7px 12px; font-size:12.5px; width:100%; }
  @media(max-width:720px){ .turn-bar{ display:block; } .turn-bar .mark-btn{ width:100%; margin-top:10px; padding:13px; font-size:15px; } }
  .ab-toggle{ display:none; }
  /* phones: tighter page — one-line heading, actions tucked behind a button, details in two columns, the 3 signatures side by side */
  @media(max-width:720px){
    .wrap{ margin:10px auto 40px; padding:0 10px; }
    .pagehead{ flex-wrap:nowrap !important; align-items:center !important; margin-bottom:8px; }
    .pagehead .sub{ display:none; }
    .pagehead h1{ font-size:18px; } .pagehead .btns{ width:auto !important; flex:none; }
    .pagehead .btns button{ padding:7px 12px; font-size:12px; }
    .sheet{ padding:14px; border-radius:12px; }
    .form-header{ padding-bottom:10px; margin-bottom:10px; gap:8px; }
    .form-title{ font-size:17px; }
    .status-pill{ padding:4px 11px; font-size:11px; text-align:center; }
    .action-bar{ display:block; padding:0; margin-bottom:10px; background:none; border:0; }
    .action-bar .ab-toggle{ display:block; width:100%; padding:9px; font-size:12.5px; background:#f8fafc; }
    .action-bar:not(.open) > :not(.ab-toggle){ display:none !important; }
    .action-bar.open{ display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px; background:#f8fafc; border:1px solid var(--line); }
    .action-bar.open .ab-toggle{ grid-column:1/-1; background:#fff; }
    .action-bar.open .ab-spacer, .action-bar.open .ab-sep{ display:none; }
    .meta-grid{ grid-template-columns:1fr 1fr; gap:2px 14px; margin-bottom:12px; }
    .meta-row{ flex-direction:column; justify-content:flex-start; border-bottom:0; padding:3px 0; min-width:0; }
    .meta-row .k{ font-size:10px; text-transform:uppercase; letter-spacing:.4px; }
    .meta-row .v{ font-size:13px; overflow-wrap:anywhere; }
    table.items-t{ margin-bottom:10px; }
    .authnote{ font-size:12px; padding:8px 10px; }
    .sign-grid{ grid-template-columns:repeat(3,1fr); gap:6px; }
    .sign-card{ padding:8px; border-radius:8px; min-width:0; }
    .sign-role{ font-size:9.5px; margin-bottom:4px; }
    .sign-name{ font-size:13px; overflow-wrap:anywhere; }
    .sign-status{ font-size:10.5px; padding:3px 7px; }
    .sign-meta{ font-size:10px; }
  }
</style>
<script src="session.js"></script>
</head>
<body>
<div class="wrap">
  <div id="appbar"></div>
  <div class="pagehead">
    <div>
      <h1 id="phTitle">Requisition</h1>
      <div class="sub">Full form view</div>
    </div>
    <div class="btns">
      <label class="inc-lbl" title="Leave the Received by line out of the PDF / CSV"><input type="checkbox" class="inc-recv" checked> Include “Received by”</label>
      <button type="button" data-full onclick="window.print()">Print</button>
      <button type="button" data-full onclick="exportCSV()">Export CSV</button>
      <button type="button" onclick="exportPDF()">Export PDF</button>
    </div>
  </div>
  <div class="sheet" id="content"><div class="center-note">Loading...</div></div>
</div>

<script src="dates.js"></script>
<script src="notify.js"></script>
<script src="mrf.js"></script>
<script src="mrfexport.js"></script>
<script src="appbar.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://ogxuwchojexznsxvvdhi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9neHV3Y2hvamV4em5zeHZ2ZGhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MTMyNTIsImV4cCI6MjEwMzk4OTI1Mn0.fbYPBohH22SXebXBQNoy0EoFDQeLwgKPyR3_v3r4R3U";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const SEND_EMAIL_URL = SUPABASE_URL + "/functions/v1/send-email";

async function sendEmail(to, subject, html){
  try{
    const resp = await fetch(SEND_EMAIL_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json","Authorization":`Bearer ${SUPABASE_ANON_KEY}`,"apikey":SUPABASE_ANON_KEY},
      body: JSON.stringify({to, subject, html})
    });
    const result = await resp.json();
    return result.success === true;
  }catch(e){ return false; }
}

const STAGE_VARS = { "Submitted":"#94a3b8","Manager Approved":"#f59e0b","Procurement Approved":"#8b5cf6","Purchased":"#2f6fed","Received":"#16a34a","Declined":"#dc2626" };

function escHtml(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function money(n){ return "$ "+Number(n||0).toFixed(2); }

if(sessionStorage.getItem("sl_person_id")) AppBar.mount("appbar", {active:"", client:supabaseClient, notice:false});
let myId=null, myPin=null;

async function init(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const content = document.getElementById("content");
  if(!id){ content.innerHTML = '<div class="center-note">No requisition specified.</div>'; return; }

  myId = sessionStorage.getItem("sl_person_id");
  myPin = sessionStorage.getItem("sl_pin");
  if(!myId || !myPin){
    // not signed in: use the normal sign-in page (company email + PIN), then come straight back here
    location.href = "login.html?redirect=" + encodeURIComponent("view.html?id=" + id);
    return;
  }

  await loadRequisition(id);
}

async function loadRequisition(id){
  const content = document.getElementById("content");
  const {data, error} = await supabaseClient.rpc("get_requisition_for_viewer", {p_person_id: myId, p_pin: myPin, p_requisition_id: id});
  if(error || !data.success){ content.innerHTML = `<div class="center-note">${escHtml((data&&data.error)||"Could not load this requisition.")}</div>`; return; }
  viewIsAdmin = false;
  try{
    const {data: adm} = await supabaseClient.rpc("verify_admin", {p_person_id: myId, p_pin: myPin});
    viewIsAdmin = adm === true;
  }catch(_){}
  render(data.requisition);
}
let viewIsAdmin = false;

function renderActions(req, steps){
  const isRequester = req.requester_person_id === myId;
  const closed = ["Declined","Withdrawn","Received"].includes(req.status);
  const shareTok = steps.length ? steps[0].token : null;
  const nextStep = steps.find(x=>x.status!=="Signed");
  const edit = [], share = [], danger = []; let del = "";

  if(viewIsAdmin) edit.push(`<a class="btn btn-primary" href="index.html?adminEdit=${req.id}">Edit in form</a>`);
  if(isRequester && req.status==="Declined") edit.push(`<a class="btn btn-primary" href="index.html?editRequisition=${req.id}">Revise &amp; Resubmit</a>`);

  if(shareTok && !closed){
    share.push(`<button onclick="copyLink('esign.html','${shareTok}','signing link')">Copy signing link</button>`);
    if((viewIsAdmin || isRequester) && nextStep) share.push(`<button onclick="regenLink('${nextStep.id}')" title="Make the current link stop working and copy a new one (${escHtml(nextStep.stage_name)})">Regenerate link</button>`);
  }

  if(viewIsAdmin && !["Declined","Purchased","Received","Withdrawn"].includes(req.status)) edit.push(`<button class="btn-danger" onclick="rejectReq('${req.id}')">Reject</button>`);
  if((isRequester || viewIsAdmin) && !["Purchased","Received","Withdrawn"].includes(req.status)) danger.push(`<button class="btn-danger" onclick="withdrawReq('${req.id}')">Withdraw</button>`);
  if(viewIsAdmin) del = `<div class="ab-group ab-del"><button class="btn-danger del" onclick="deleteReq('${req.id}')">Delete…</button></div>`;

  if(!edit.length && !share.length && !danger.length && !del) return "";
  const groups = [];
  if(edit.length) groups.push(`<div class="ab-group">${edit.join("")}</div>`);
  if(share.length) groups.push(`<div class="ab-group">${share.join("")}</div>`);
  const left = groups.join('<div class="ab-sep"></div>');
  return `
    <div class="action-bar" id="actionBar">
      <button type="button" class="ab-toggle" onclick="document.getElementById('actionBar').classList.toggle('open')">Actions ▾</button>
      ${left}
      <div class="ab-spacer"></div>
      ${danger.length ? `<div class="ab-group">${danger.join("")}</div>` : ""}
      ${del}
    </div>
    <div class="actions-msg" id="actionsMsg"></div>`;
}
function actionsMsg(t){ const el=document.getElementById("actionsMsg"); if(el) el.textContent=t; }
async function copyLink(page, tok, label){
  const url = new URL(page, window.location.href);
  url.searchParams.set("token", tok);
  try{ await navigator.clipboard.writeText(url.toString()); actionsMsg(label[0].toUpperCase()+label.slice(1)+" copied."); }
  catch(_){ window.prompt("Copy this "+label+":", url.toString()); }
}
async function withdrawReq(id){
  if(!(await AppBar.confirmTwice(AppBar.CONFIRM.withdraw))) return;
  const asAdmin = viewIsAdmin && !(currentReq && currentReq.requester_person_id===myId);
  const {data, error} = asAdmin
    ? await supabaseClient.rpc("admin_withdraw_requisition", {p_admin_id: myId, p_admin_pin: myPin, p_requisition_id: id})
    : await supabaseClient.rpc("requester_withdraw", {p_person_id: myId, p_pin: myPin, p_requisition_id: id});
  if(error || !data.success){ actionsMsg((data&&data.error)||(error&&error.message)||"Failed to withdraw."); return; }
  await loadRequisition(id);
  actionsMsg("Requisition withdrawn.");
  Notify.show({tone:"info", icon:"undo", title:"Requisition withdrawn", sub:`${(currentReq&&currentReq.tracking_no)||"It"} has been stopped.`,
    html:"<p>Nobody can sign it any more. It stays in the list as <b>Withdrawn</b>.</p>",
    primary:{label:"Back to dashboard", href:"dashboard.html"}, secondary:{label:"Stay here"}});
}
async function rejectReq(id){
  const reason = (window.prompt("Reason for rejecting this requisition (the requester will see it):") || "").trim();
  if(!reason) return;
  if(!(await AppBar.confirmTwice(AppBar.CONFIRM.reject))) return;
  const {data, error} = await supabaseClient.rpc("admin_reject_requisition", {p_admin_id: myId, p_admin_pin: myPin, p_requisition_id: id, p_reason: reason});
  if(error || !data.success){ actionsMsg((data&&data.error)||(error&&error.message)||"Failed to reject."); return; }
  await loadRequisition(id);
  actionsMsg("Requisition rejected.");
  Notify.show({tone:"warn", icon:"x", title:"Requisition rejected", sub:`${(currentReq&&currentReq.tracking_no)||"It"} was sent back.`,
    html:`<p>The requester can see your reason and can <b>fix &amp; resubmit</b>. Approval restarts from the Team Manager.</p>`,
    primary:{label:"Back to dashboard", href:"dashboard.html"}, secondary:{label:"Stay here"}});
}
async function deleteReq(id){
  if(!(await AppBar.confirmTwice(AppBar.CONFIRM.del))) return;
  const {data, error} = await supabaseClient.rpc("admin_delete_requisition", {p_admin_id: myId, p_admin_pin: myPin, p_requisition_id: id});
  if(error || !data.success){ actionsMsg((data&&data.error)||(error&&error.message)||"Failed to delete."); return; }
  Notify.show({tone:"danger", icon:"trash", title:"Requisition deleted", sub:"It has been permanently removed.",
    primary:{label:"Back to dashboard", href:"dashboard.html"}, onClose:()=>{ window.location.href = "dashboard.html"; }});
}
async function regenLink(stepId){
  if(!(await AppBar.confirmTwice(AppBar.CONFIRM.regen))) return;
  const {data, error} = await supabaseClient.rpc("regenerate_step_token", {p_person_id: myId, p_pin: myPin, p_step_id: stepId});
  if(error || !data.success){ actionsMsg((data&&data.error)||(error&&error.message)||"Failed."); return; }
  const url = new URL("esign.html", window.location.href);
  url.searchParams.set("token", data.token);
  try{ await navigator.clipboard.writeText(url.toString()); }catch(_){ window.prompt("New link — the old one no longer works:", url.toString()); }
  await loadRequisition(currentReq.id);
  actionsMsg("New link copied — the old one no longer works.");
  Notify.show({tone:"success", icon:"link", title:"New link copied", sub:"The old link no longer works.",
    html:"<p>Send the <b>new link</b> to whoever should sign next. It is already on your clipboard.</p>",
    primary:{label:"Got it"}});
}

let viewLegacy = false;
// new flow: the person whose turn it is for Procurement / Received can press the button right here (no signature)
const markWord = o => o===2 ? "Mark as ordered" : "Mark as received";
const isBtn = s => viewLegacy ? s.step_order===4 : s.step_order>=2;       // older 4-step requisitions: only the last (Received) step is a button
function canMark(step, steps){
  if(!step || !isBtn(step) || step.status!=="Pending" || !step.token) return false;
  if(currentReq && ["Declined","Withdrawn"].includes(currentReq.status)) return false;
  if(step.assigned_person_id && step.assigned_person_id !== myId) return false;
  const first = steps.find(x=>x.status!=="Signed");
  return !!first && first.id === step.id;                  // only the step whose turn it is
}
async function markStep(token, order){
  const name = sessionStorage.getItem("sl_person_name") || "you";
  if(!confirm(`${markWord(order)}? This records ${name} and the time on the requisition.`)) return;
  document.querySelectorAll(".mark-btn").forEach(b=>b.disabled = true);
  const {data, error} = await supabaseClient.rpc("esign_confirm_step_as", {p_token: token, p_step_order: order, p_person_id: myId, p_pin: myPin});
  if(error || !data || !data.success){ document.querySelectorAll(".mark-btn").forEach(b=>b.disabled = false); actionsMsg((data&&data.error)||(error&&error.message)||"Could not save that."); alert((data&&data.error)||(error&&error.message)||"Could not save that."); return; }
  await loadRequisition(currentReq.id);
  Notify.show({tone:"success", title: order===2 ? "Marked as ordered" : "Marked as received", sub:"Saved with your name and the time.", primary:{label:"Back to dashboard", href:"dashboard.html"}, secondary:{label:"Stay here"}});
}
function turnBar(req, steps){
  const st = steps.find(x=>canMark(x, steps)); if(!st) return "";
  return `<div class="turn-bar"><div><b>Your turn: ${escHtml(st.step_order===2 ? "Procurement" : "Received")}</b><span>${st.step_order===2 ? "Press the button once the items are ordered." : "Press the button when the items have arrived."} No signature needed.</span></div><button type="button" class="mark-btn" onclick="markStep('${escHtml(st.token)}', ${st.step_order})">${markWord(st.step_order)}</button></div>`;
}
// new flow: Procurement and Received are one-tap buttons, so they read "Ordered" / "Received" instead of "Signed"
const doneWord = step => (isBtn(step) && !step.signature_data) ? (step.step_order===2 ? "Ordered" : "Received") : "Signed";
function signCard(step){
  if(!step) return '<div class="sign-card"><div class="sign-status pending">Not assigned</div></div>';
  let statusHtml, metaHtml="", declineHtml="", overrideHtml="";
  if(step.status==="Signed"){
    statusHtml = `<span class="sign-status signed">✓ ${doneWord(step)}</span>`;
    metaHtml = `<div class="sign-meta">${fmtDateTime(step.signed_at)}</div>` +
      (step.signature_data && /^data:image\/png;base64,[A-Za-z0-9+\/=]+$/.test(step.signature_data)
        ? `<img src="${step.signature_data}" alt="signature" style="display:block;max-height:46px;max-width:100%;margin-top:6px">` : "");
    if(step.is_override) overrideHtml = `<div class="override-tag">Fast-forwarded by admin (${escHtml(step.override_by)})</div>`;
  } else if(step.status==="Declined"){
    statusHtml = `<span class="sign-status declined">✕ Declined</span>`;
    metaHtml = `<div class="sign-meta">${fmtDateTime(step.declined_at)}</div>`;
    declineHtml = `<div class="decline-box">Reason: ${escHtml(step.decline_reason||"—")}</div>`;
  } else {
    statusHtml = `<span class="sign-status pending">Pending</span>`;
  }
  return `
    <div class="sign-card">
      <div class="sign-role">${escHtml(step.stage_name)}</div>
      <div class="sign-name">${escHtml(step.assigned_person_name||"—")}</div>
      ${statusHtml}
      ${canMark(step, currentSteps) ? `<button type="button" class="mark-btn small" onclick="markStep('${escHtml(step.token)}', ${step.step_order})">${markWord(step.step_order)}</button>` : ""}
      ${metaHtml}
      ${declineHtml}
      ${overrideHtml}
    </div>`;
}

let currentReq = null, currentSteps = [];

function render(req){
  currentReq = req;
  document.getElementById("phTitle").textContent = req.tracking_no || "Requisition";
  const items = (req.requisition_items||[]).slice().sort((a,b)=>(a.sn||0)-(b.sn||0));
  const steps = (req.approval_steps||[]).slice().sort((a,b)=>a.step_order-b.step_order);
  viewLegacy = MRF.isLegacy(steps); currentSteps = steps;
  const byOrder = {}; steps.forEach(s=>byOrder[s.step_order]=s);

  const itemRows = items.map(it=>`
    <tr class="itm">
      <td class="c-sn">${it.sn}</td>
      <td class="c-nm">${escHtml(it.name)}${it.link?` — <a href="${escHtml(it.link)}" target="_blank">link ↗</a>`:""}</td>
      <td class="c-ds">${escHtml(it.description)}</td>
      <td class="num c-q" data-l="Qty">${it.qty}</td>
      <td class="num c-u" data-l="Unit price">${money(it.unit_price)}</td>
      <td class="num c-d" data-l="Delivery / tax">${money(it.delivery_tax)}</td>
      <td class="num c-t" data-l="Total">${money(it.total)}</td>
    </tr>`).join("");

  document.getElementById("content").innerHTML = `
    <div class="form-header">
      <div>
        <div class="form-title">${escHtml(req.project_name||"Untitled Project")}</div>
        <div class="form-sub">Materials Requisition — ${escHtml(req.tracking_no)}</div>
      </div>
      <span class="status-pill" style="background:${STAGE_VARS[req.status]||'#94a3b8'}">${escHtml(req.status)}</span>
    </div>

    ${req.status==="Declined" ? `<div class="decline-box" style="margin-bottom:16px">Declined by ${escHtml(req.declined_by)} on ${req.declined_at?fmtDateTime(req.declined_at):""} — Reason: ${escHtml(req.decline_reason||"—")}</div>` : ""}

    ${turnBar(req, steps)}
    ${renderActions(req, steps)}

    <div class="meta-grid">
      <div class="meta-row"><span class="k">Project Location</span><span class="v">${escHtml(req.project_location||"-")}</span></div>
      <div class="meta-row"><span class="k">Requested By</span><span class="v">${escHtml(req.request_by||"-")}</span></div>
      <div class="meta-row"><span class="k">Form Date</span><span class="v">${escHtml(fmtDMY(req.form_date)||"-")}</span></div>
      <div class="meta-row"><span class="k">Supply Date</span><span class="v">${escHtml(fmtDMY(req.supply_date)||"-")}</span></div>
      <div class="meta-row"><span class="k">PC No.</span><span class="v">${escHtml(req.pc_no||"-")}</span></div>
      <div class="meta-row"><span class="k">PM In-Charge</span><span class="v">${escHtml(req.pm_incharge||"-")}</span></div>
    </div>

    <table class="items-t">
      <thead><tr><th>S/N</th><th>Name</th><th>Description</th><th class="num">Qty</th><th class="num">Unit Price</th><th class="num">Delv/Tax</th><th class="num">Total</th></tr></thead>
      <tbody>${itemRows || '<tr><td colspan="7" style="text-align:center;color:var(--muted)">No line items</td></tr>'}</tbody>
      <tfoot>
        <tr><td colspan="6">Materials Subtotal</td><td class="num">${money(req.materials_subtotal)}</td></tr>
        <tr><td colspan="6">Delivery / Tax Subtotal</td><td class="num">${money(req.delivery_tax_subtotal)}</td></tr>
        <tr><td colspan="6">GRAND TOTAL</td><td class="num">${money(req.grand_total)}</td></tr>
      </tfoot>
    </table>

    ${MRF.isLegacy(steps) ? "" : `<div class="authnote">This requisition is <b>${money(req.grand_total)}</b> → verification by <b>${escHtml(MRF.requiredText(req.grand_total))}</b>${MRF.required(req.grand_total).doc ? ` · <b>${escHtml(MRF.required(req.grand_total).doc)}</b>` : ""}. Procurement then presses “Mark as ordered”, and the receiver presses “Mark as received” — only the manager signs. <a href="#" onclick="MRF.showRules(currentReq.grand_total);return false" style="color:#2050bd;font-weight:700">View approval rules</a></div>`}
    <div class="sign-grid">
      ${steps.map(st=>signCard(st)).join("")}
    </div>
  `;
}

// ---------------- exports (same PDF / CSV on every page: see mrfexport.js) ----------------
const exportReq = () => Object.assign({}, currentReq, {steps: currentReq.approval_steps || []});
function exportCSV(){
  if(!currentReq){ alert("Nothing loaded yet."); return; }
  MRFExport.downloadCSV(exportReq());
}
async function exportPDF(){
  if(!currentReq){ alert("Nothing loaded yet."); return; }
  try{ const pdf = await MRFExport.pdf(exportReq()); pdf.save(MRFExport.fileName(currentReq, "pdf")); }
  catch(e){ console.error(e); alert("Could not create the PDF: " + (e.message||e)); }
}

init();
</script>
</body>
