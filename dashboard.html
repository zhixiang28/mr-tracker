<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACElogic — MR Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2933; --muted:#6b7280; --line:#d7dbe0;
    --accent:#2f6fed; --accent-dark:#2050bd; --bg:#eef1f6; --paper:#ffffff;
    --submitted:#94a3b8; --manager:#f59e0b; --procurement:#8b5cf6; --purchased:#2f6fed;
    --received:#16a34a; --declined:#dc2626;
  }
  *{box-sizing:border-box}
  body{ margin:0; font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  .app{ max-width:1300px; margin:28px auto; padding:0 18px 60px; }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  .brand{ font-weight:800; font-size:20px; letter-spacing:-.3px; }
  .brand span{ font-weight:400; color:var(--muted); }
  .actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  input,select{ font:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:#fff; color:var(--ink); outline:none; }
  input:focus,select:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,111,237,.12); }
  button{ border:1px solid var(--line); background:#fff; color:var(--ink); padding:9px 14px; border-radius:8px; cursor:pointer; font-weight:600; font-size:12.5px; font-family:inherit; }
  button:hover{ background:#f4f6f8; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .primary:hover{ background:var(--accent-dark); }
  .view-badge{ font-size:11px; font-weight:700; color:var(--muted); background:#eef1f6; border:1px solid var(--line); padding:5px 10px; border-radius:999px; }

  .pipeline{ display:grid; grid-template-columns:repeat(6,1fr); gap:0; background:#fff; border-radius:14px; box-shadow:0 8px 24px rgba(15,23,42,.07); overflow:hidden; margin-bottom:22px; }
  .stage-cell{ padding:16px 10px; position:relative; border-right:1px solid var(--line); cursor:pointer; transition:background .15s ease; }
  .stage-cell:last-child{ border-right:0; }
  .stage-cell:hover{ background:#f8fafc; }
  .stage-cell.active{ background:#f0f5ff; }
  .stage-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
  .stage-label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; color:var(--muted); }
  .stage-count{ font-size:24px; font-weight:800; margin-top:6px; line-height:1; }

  .toolbar2{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .toolbar2 input[type=text]{ flex:1; min-width:200px; }
  .count-note{ font-size:12px; color:var(--muted); margin-left:auto; }

  .sheet{ background:var(--paper); border-radius:14px; box-shadow:0 8px 24px rgba(15,23,42,.07); overflow:hidden; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700; padding:12px 14px; border-bottom:1px solid var(--line); background:#fafbfc; }
  tbody td{ padding:12px 14px; border-bottom:1px solid #eef0f2; vertical-align:middle; }
  tbody tr.req-row:hover{ background:#fafcff; cursor:pointer; }
  .tracking{ font-weight:700; color:var(--accent-dark); }
  .proj{ font-weight:600; }
  .muted{ color:var(--muted); font-size:12px; }
  .pill{ display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; font-size:11.5px; font-weight:700; color:#fff; white-space:nowrap; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--muted); }
  .empty-state h3{ color:var(--ink); margin-bottom:6px; }
  .status-msg{ font-size:12.5px; color:var(--accent-dark); font-weight:600; min-height:16px; margin-top:10px; }
  .chev{ display:inline-block; transition:transform .15s ease; color:var(--muted); }
  .chev.open{ transform:rotate(90deg); }

  .items-panel{ background:#fafbfc; }
  .items-panel td{ padding:0; border-bottom:1px solid var(--line); }
  .items-inner{ padding:16px 24px 24px 44px; display:grid; grid-template-columns:1fr 300px; gap:26px; }
  @media(max-width:900px){ .items-inner{ grid-template-columns:1fr; } .pipeline{ grid-template-columns:repeat(2,1fr);} }

  .item-row{ display:grid; grid-template-columns:1fr 60px 80px 80px 80px; gap:10px; align-items:center; padding:7px 0; border-bottom:1px dashed #e2e5ea; font-size:12.5px; }
  .item-row:last-child{ border-bottom:0; }
  .item-row .ihead{ font-weight:700; font-size:10px; text-transform:uppercase; color:var(--muted); border-bottom:none; }
  .item-name{ font-weight:600; }
  .item-desc{ color:var(--muted); font-size:11.5px; }
  .num{ text-align:right; }
  a.item-link{ color:var(--accent); text-decoration:none; font-size:11.5px; }

  .timeline{ display:flex; flex-direction:column; gap:0; }
  .tstep{ display:flex; gap:10px; padding:10px 0; border-bottom:1px dashed #e2e5ea; }
  .tstep:last-child{ border-bottom:0; }
  .tdot{ width:20px; height:20px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; font-weight:700; margin-top:1px; }
  .tdot.signed{ background:var(--received); }
  .tdot.pending{ background:#cbd5e1; }
  .tdot.declined{ background:var(--declined); }
  .tstage{ font-weight:700; font-size:12.5px; }
  .tmeta{ font-size:11.5px; color:var(--muted); }
  .sign-box{ margin-top:8px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; }
  .sign-box input{ width:100%; margin-bottom:6px; }
  .sign-box .row{ display:flex; gap:6px; }
  .sign-box .row button{ flex:1; }
  .sign-error{ color:var(--declined); font-size:11.5px; margin-top:4px; }
  .decline-reason-box{ font-size:11.5px; color:var(--declined); background:#fef2f2; border:1px solid #fecaca; border-radius:6px; padding:6px 8px; margin-top:4px; }
  .open-link-btn{ font-size:11px; margin-top:6px; }
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="brand">SPACE<span>logic</span> — MR Tracker</div>
    <div class="actions">
      <span class="view-badge">👁 View-only — sign with name + PIN to act</span>
      <button onclick="loadData()">Refresh</button>
      <a href="index.html"><button class="primary" type="button">＋ New Requisition</button></a>
    </div>
  </div>

  <div class="pipeline" id="pipeline"></div>

  <div class="toolbar2">
    <input type="text" id="searchBox" placeholder="Search by tracking no, project, or requester..." oninput="render()">
    <select id="stageFilter" onchange="render()">
      <option value="">All stages</option>
      <option>Submitted</option>
      <option>Manager Approved</option>
      <option>Procurement Approved</option>
      <option>Purchased</option>
      <option>Received</option>
      <option>Declined</option>
    </select>
    <span class="count-note" id="countNote"></span>
  </div>

  <div class="sheet">
    <table id="reqTable">
      <thead>
        <tr>
          <th style="width:26px"></th>
          <th>Tracking No</th>
          <th>Project</th>
          <th>Requested By</th>
          <th>Date</th>
          <th>Grand Total</th>
          <th>Stage</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none">
      <h3>No requisitions yet</h3>
      <div>Submit one from the form and it will show up here.</div>
    </div>
  </div>
  <div class="status-msg" id="statusMsg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://ogxuwchojexznsxvvdhi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9neHV3Y2hvamV4em5zeHZ2ZGhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MTMyNTIsImV4cCI6MjEwMzk4OTI1Mn0.fbYPBohH22SXebXBQNoy0EoFDQeLwgKPyR3_v3r4R3U";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STAGES = ["Submitted","Manager Approved","Procurement Approved","Purchased","Received","Declined"];
const STAGE_VARS = { "Submitted":"--submitted","Manager Approved":"--manager","Procurement Approved":"--procurement","Purchased":"--purchased","Received":"--received","Declined":"--declined" };

let allReqs = [];
let openRows = new Set();
let activeStageFilter = "";

function setStatus(t){
  const el=document.getElementById("statusMsg");
  el.textContent=t;
  clearTimeout(window._st);
  window._st=setTimeout(()=>el.textContent="",5000);
}
function fmtMoney(n){ return "$ " + Number(n||0).toFixed(2); }
function escapeHtml(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderPipeline(){
  const el=document.getElementById("pipeline");
  el.innerHTML = STAGES.map(stage=>{
    const count = allReqs.filter(r=>r.status===stage).length;
    const active = activeStageFilter===stage ? "active" : "";
    return `
      <div class="stage-cell ${active}" onclick="toggleStageFilter('${stage}')">
        <div class="stage-label"><span class="stage-dot" style="background:var(${STAGE_VARS[stage]})"></span>${stage}</div>
        <div class="stage-count">${count}</div>
      </div>`;
  }).join("");
}
function toggleStageFilter(stage){
  activeStageFilter = (activeStageFilter===stage) ? "" : stage;
  document.getElementById("stageFilter").value = activeStageFilter;
  render();
}
function matchesSearch(r, q){
  if(!q) return true;
  q=q.toLowerCase();
  return (r.tracking_no||"").toLowerCase().includes(q) || (r.project_name||"").toLowerCase().includes(q) || (r.request_by||"").toLowerCase().includes(q);
}

function render(){
  const q = document.getElementById("searchBox").value.trim();
  const stageSel = document.getElementById("stageFilter").value;
  activeStageFilter = stageSel;
  const filtered = allReqs.filter(r=>matchesSearch(r,q) && (!stageSel || r.status===stageSel));
  document.getElementById("countNote").textContent = `${filtered.length} of ${allReqs.length} requisitions`;
  renderPipeline();

  const tbody = document.getElementById("tbody");
  document.getElementById("reqTable").style.display = allReqs.length ? "table" : "none";
  document.getElementById("emptyState").style.display = allReqs.length ? "none" : "block";

  tbody.innerHTML = filtered.map(r=>{
    const isOpen = openRows.has(r.id);
    const mainRow = `
      <tr class="req-row" onclick="toggleRow('${r.id}')">
        <td><span class="chev ${isOpen?'open':''}">›</span></td>
        <td class="tracking">${r.tracking_no||"-"}</td>
        <td class="proj">${escapeHtml(r.project_name||"-")}<div class="muted">${escapeHtml(r.project_location||"")}</div></td>
        <td>${escapeHtml(r.request_by||"-")}</td>
        <td class="muted">${r.form_date||"-"}</td>
        <td>${fmtMoney(r.grand_total)}</td>
        <td><span class="pill" style="background:var(${STAGE_VARS[r.status]||'--submitted'})">${escapeHtml(r.status)}</span></td>
      </tr>`;
    const detailRow = isOpen ? `<tr class="items-panel"><td colspan="7"><div class="items-inner">${renderItemsBlock(r)}${renderTimelineBlock(r)}</div></td></tr>` : "";
    return mainRow + detailRow;
  }).join("");
}

function renderItemsBlock(r){
  const items = (r.requisition_items||[]).slice().sort((a,b)=>(a.sn||0)-(b.sn||0));
  const rows = items.map(it=>`
    <div class="item-row">
      <div>
        <div class="item-name">${escapeHtml(it.name||"-")}</div>
        <div class="item-desc">${escapeHtml(it.description||"")}</div>
        ${it.link?`<a class="item-link" href="${escapeHtml(it.link)}" target="_blank" onclick="event.stopPropagation()">Open link ↗</a>`:""}
      </div>
      <div class="num">${it.qty}</div>
      <div class="num">${fmtMoney(it.unit_price)}</div>
      <div class="num">${fmtMoney(it.delivery_tax)}</div>
      <div class="num" style="font-weight:700">${fmtMoney(it.total)}</div>
    </div>`).join("");
  return `
    <div>
      <div style="font-weight:700;font-size:12.5px;margin-bottom:8px">Materials</div>
      <div class="item-row ihead"><div>Item</div><div class="num">Qty</div><div class="num">Unit</div><div class="num">Delv/Tax</div><div class="num">Total</div></div>
      ${rows || '<div class="muted" style="padding:10px 0">No line items.</div>'}
    </div>`;
}

function renderTimelineBlock(r){
  const steps = (r.approval_steps||[]).slice().sort((a,b)=>a.step_order-b.step_order);
  const prevSignedUpTo = (() => {
    let i=0;
    while(i<steps.length && steps[i].status==="Signed") i++;
    return i; // index of the current pending step (0-based)
  })();

  const rowsHtml = steps.map((s,idx)=>{
    let dotCls="pending", dotChar=String(s.step_order);
    if(s.status==="Signed"){ dotCls="signed"; dotChar="✓"; }
    if(s.status==="Declined"){ dotCls="declined"; dotChar="✕"; }

    let metaLine="";
    if(s.status==="Signed") metaLine = `Signed by ${escapeHtml(s.assigned_person_name)} · ${new Date(s.signed_at).toLocaleString()}`;
    else if(s.status==="Declined") metaLine = `Declined by ${escapeHtml(s.assigned_person_name)} · ${new Date(s.declined_at).toLocaleString()}`;
    else metaLine = `Assigned to ${escapeHtml(s.assigned_person_name)} — pending`;

    const isActionable = s.status==="Pending" && idx===prevSignedUpTo && r.status!=="Declined";
    const declineReasonHtml = s.status==="Declined" ? `<div class="decline-reason-box">Reason: ${escapeHtml(s.decline_reason||"—")}</div>` : "";

    const actionHtml = isActionable ? `
      <button class="open-link-btn" onclick="event.stopPropagation();toggleSignBox('${s.id}')">Sign / Decline as ${escapeHtml(s.assigned_person_name)}</button>
      <div class="sign-box" id="signbox-${s.id}" style="display:none" onclick="event.stopPropagation()">
        <input type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" id="pin-${s.id}">
        <input type="text" placeholder="Reason (only needed to decline)" id="reason-${s.id}">
        <div class="row">
          <button class="primary" onclick="dashApprove('${s.token}','${s.id}')">Approve</button>
          <button onclick="dashDecline('${s.token}','${s.id}')">Decline</button>
        </div>
        <div class="sign-error" id="signerr-${s.id}"></div>
      </div>` : "";

    return `
      <div class="tstep">
        <div class="tdot ${dotCls}">${dotChar}</div>
        <div style="flex:1">
          <div class="tstage">${escapeHtml(s.stage_name)}</div>
          <div class="tmeta">${metaLine}</div>
          ${declineReasonHtml}
          ${actionHtml}
        </div>
      </div>`;
  }).join("");

  return `<div><div style="font-weight:700;font-size:12.5px;margin-bottom:8px">Approval Chain</div><div class="timeline">${rowsHtml}</div></div>`;
}

function toggleRow(id){
  if(openRows.has(id)) openRows.delete(id); else openRows.add(id);
  render();
}
function toggleSignBox(stepId){
  const box=document.getElementById("signbox-"+stepId);
  box.style.display = box.style.display==="block" ? "none" : "block";
}

async function dashApprove(token, stepId){
  const pin=document.getElementById("pin-"+stepId).value.trim();
  const errEl=document.getElementById("signerr-"+stepId);
  if(!/^\d{4}$/.test(pin)){ errEl.textContent="Enter a 4-digit PIN."; return; }
  const {data, error} = await supabaseClient.rpc("sign_step", {p_token: token, p_pin: pin});
  if(error || !data.success){ errEl.textContent = (data&&data.error) || (error&&error.message) || "Failed."; return; }
  setStatus(`Signed off by ${data.signed_by} on ${data.stage}.`);
  await loadData(true);
}
async function dashDecline(token, stepId){
  const pin=document.getElementById("pin-"+stepId).value.trim();
  const reason=document.getElementById("reason-"+stepId).value.trim();
  const errEl=document.getElementById("signerr-"+stepId);
  if(!/^\d{4}$/.test(pin)){ errEl.textContent="Enter a 4-digit PIN."; return; }
  if(!reason){ errEl.textContent="Enter a reason to decline."; return; }
  const {data, error} = await supabaseClient.rpc("decline_step", {p_token: token, p_pin: pin, p_reason: reason});
  if(error || !data.success){ errEl.textContent = (data&&data.error) || (error&&error.message) || "Failed."; return; }
  setStatus(`Declined by ${data.declined_by} at ${data.stage}.`);
  await loadData(true);
}

async function loadData(keepOpen){
  setStatus("Loading...");
  const {data, error} = await supabaseClient
    .from("requisitions")
    .select("*, requisition_items(*), approval_steps(*)")
    .order("created_at", {ascending:false});
  if(error){ setStatus("Could not load data: "+error.message); return; }
  allReqs = data || [];
  setStatus("");
  render();
}

loadData();
</script>
</body>
</html>
