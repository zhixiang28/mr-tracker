<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACElogic — E-Sign Approval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2933; --muted:#6b7280; --line:#d7dbe0;
    --accent:#2f6fed; --accent-dark:#2050bd; --bg:#eef1f6; --paper:#ffffff;
    --danger:#dc2626; --success:#16a34a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg); padding:20px;
  }
  .card{
    background:var(--paper); border-radius:16px; box-shadow:0 12px 32px rgba(15,23,42,.1);
    max-width:560px; width:100%; padding:30px 28px;
  }
  .brand{ font-weight:800; font-size:15px; letter-spacing:-.2px; margin-bottom:4px; color:var(--muted); }
  h1{ font-size:20px; margin:0 0 18px; }
  .summary{
    background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:20px;
    font-size:13px; line-height:1.7;
  }
  .summary b{ color:var(--ink); }
  .summary .row{ display:flex; justify-content:space-between; gap:10px; }
  .stage-tag{
    display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    color:#fff; background:var(--accent); padding:4px 10px; border-radius:999px; margin-bottom:12px;
  }
  label{ display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin:14px 0 6px; }
  input{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    font:inherit; font-size:15px;
  }
  input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,111,237,.12); }
  .actions{ display:flex; gap:10px; margin-top:22px; }
  button{
    flex:1; border:none; border-radius:10px; padding:13px; font:inherit; font-weight:700;
    font-size:14px; cursor:pointer;
  }
  .btn-approve{ background:var(--success); color:#fff; }
  .btn-decline{ background:#fff; color:var(--danger); border:1.5px solid var(--danger); }
  .msg{ font-size:13px; margin-top:14px; padding:10px 12px; border-radius:8px; display:none; line-height:1.5; }
  .msg.error{ background:#fef2f2; color:var(--danger); border:1px solid #fecaca; display:block; }
  .msg.success{ background:#f0fdf4; color:var(--success); border:1px solid #bbf7d0; display:block; }
  .decline-panel{ display:none; margin-top:14px; }
  .link-copy-box{
    display:flex; gap:8px; margin:12px 0; align-items:center; background:#f4f6f8;
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
  }
  .link-copy-box input{ flex:1; border:0; background:transparent; font-size:12px; padding:2px; }
  .link-copy-box button{ flex:none; padding:8px 14px; font-size:12px; background:var(--accent); color:#fff; }
  .center-note{ text-align:center; color:var(--muted); font-size:13px; padding:30px 0; }
  a{ color:var(--accent); }
  .items-table{ width:100%; border-collapse:collapse; font-size:12px; margin:12px 0 4px; }
  .items-table th{ text-align:left; font-size:9.5px; text-transform:uppercase; color:var(--muted); border-bottom:2px solid var(--ink); padding:5px 6px; }
  .items-table td{ padding:6px; border-bottom:1px solid var(--line); }
  .items-table td.num, .items-table th.num{ text-align:right; }
  .items-table tfoot td{ font-weight:700; border-bottom:none; }
  .meta-line{ display:flex; justify-content:space-between; font-size:12px; padding:3px 0; border-bottom:1px dotted var(--line); }
  .meta-line span:first-child{ color:var(--muted); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="brand">SPACElogic</div>
  <div class="center-note" id="loadingNote">Loading requisition...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://ogxuwchojexznsxvvdhi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9neHV3Y2hvamV4em5zeHZ2ZGhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MTMyNTIsImV4cCI6MjEwMzk4OTI1Mn0.fbYPBohH22SXebXBQNoy0EoFDQeLwgKPyR3_v3r4R3U";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const SEND_EMAIL_URL = SUPABASE_URL + "/functions/v1/send-email";

async function sendEmail(to, subject, html){
  try{
    const resp = await fetch(SEND_EMAIL_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json","Authorization":`Bearer ${SUPABASE_ANON_KEY}`,"apikey":SUPABASE_ANON_KEY},
      body: JSON.stringify({to, subject, html})
    });
    const result = await resp.json();
    return result.success === true;
  }catch(e){ return false; }
}

async function sendNotification(callerId, callerPin, requisitionId, event){
  try{
    const {data: target} = await supabaseClient.rpc("get_notification_target", {
      p_caller_person_id: callerId, p_caller_pin: callerPin, p_requisition_id: requisitionId, p_event: event
    });
    if(!target || !target.success) return; // no email on file, or not authorized — skip quietly
    await fetch(SEND_EMAIL_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json","Authorization":`Bearer ${SUPABASE_ANON_KEY}`,"apikey":SUPABASE_ANON_KEY},
      body: JSON.stringify({to: target.to, subject: target.subject, html: target.html})
    });
  }catch(e){ console.error("Notification email failed:", e); }
}

const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const card = document.getElementById("card");

function escHtml(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function money(n){ return "$ "+Number(n||0).toFixed(2); }

let peopleCache = [];

async function init(){
  if(!token){
    card.innerHTML = `<div class="brand">SPACElogic</div><div class="center-note">No signing link provided. Ask whoever sent this for the full link.</div>`;
    return;
  }
  const {data: ctx, error: ctxErr} = await supabaseClient.rpc("get_signing_context", {p_token: token});
  if(ctxErr || !ctx.success){
    card.innerHTML = `<div class="brand">SPACElogic</div><div class="center-note">This signing link isn't valid. Ask whoever sent it to resend from the dashboard.</div>`;
    return;
  }
  const step = ctx.step;
  const req = ctx.requisition;
  const prevSteps = ctx.all_steps;
  const {data: peopleData} = await supabaseClient.from("people_public").select("id,name").order("name");
  peopleCache = peopleData || [];

  renderCard(step, req, prevSteps || []);
}

function renderCard(step, req, allSteps){
  const prevIncomplete = allSteps.find(s=>s.step_order < step.step_order && s.status!=="Signed");

  if(step.status==="Signed"){
    card.innerHTML = statusOnlyView(step, req, "success",
      `${escHtml(step.assigned_person_name)} already signed off on <b>${escHtml(step.stage_name)}</b> on ${new Date(step.signed_at).toLocaleString()}.`);
    return;
  }
  if(step.status==="Declined"){
    card.innerHTML = statusOnlyView(step, req, "error",
      `This requisition was declined at the <b>${escHtml(step.stage_name)}</b> step. Reason: "${escHtml(step.decline_reason||"—")}"`);
    return;
  }
  if(req.status==="Declined"){
    card.innerHTML = statusOnlyView(step, req, "error", `This requisition was declined earlier in the chain and can't proceed.`);
    return;
  }
  if(prevIncomplete){
    card.innerHTML = statusOnlyView(step, req, "error",
      `Waiting on <b>${escHtml(prevIncomplete.assigned_person_name)}</b> to complete the <b>${escHtml(prevIncomplete.stage_name)}</b> step first. Check back once they've signed.`);
    return;
  }

  const isUnclaimed = !step.assigned_person_id;
  const identityHtml = isUnclaimed ? `
    <div style="font-size:13.5px;margin-bottom:6px">This step hasn't been claimed yet. Type your name — if you've registered before, pick your name from the suggestions; if not, this registers you now.</div>
    <label>Your name</label>
    <input type="text" id="nameInput" list="peopleList" placeholder="Full name" autocomplete="off" oninput="toggleConfirmPin()">
    <datalist id="peopleList">${peopleCache.map(p=>`<option value="${escHtml(p.name)}">`).join("")}</datalist>
    <div id="newEmailWrap" style="display:none">
      <label>Company email</label>
      <input type="email" id="newEmailInput" placeholder="you@spacelogic.com.sg">
    </div>
    <label id="pinLabel">${peopleCache.length ? "Your PIN (existing) or choose a new 4-digit PIN" : "Choose a 4-digit PIN"}</label>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="4" placeholder="••••">
    <div id="confirmPinWrap" style="display:none">
      <label>Confirm new PIN</label>
      <input type="password" id="confirmPinInput" inputmode="numeric" maxlength="4" placeholder="••••">
    </div>
    <div id="codeWrap" style="display:none">
      <label>Verification code (check your email)</label>
      <input type="text" id="regCodeInput" maxlength="6" inputmode="numeric" placeholder="123456" autocomplete="off">
    </div>
  ` : `
    <div style="font-size:13.5px;margin-bottom:6px">
      You're signing as <b>${escHtml(step.assigned_person_name)}</b>. Enter your 4-digit PIN to confirm.
    </div>
    <label>Your PIN</label>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="4" placeholder="••••">
  `;

  const items = (req.requisition_items||[]).slice().sort((a,b)=>(a.sn||0)-(b.sn||0));
  const itemRows = items.map(it=>`
    <tr>
      <td>${escHtml(it.name)}${it.link?` — <a href="${escHtml(it.link)}" target="_blank">link ↗</a>`:""}<div style="color:var(--muted);font-size:11px">${escHtml(it.description||"")}</div></td>
      <td class="num">${it.qty}</td>
      <td class="num">${money(it.unit_price)}</td>
      <td class="num">${money(it.total)}</td>
    </tr>`).join("");

  const fullFormHtml = `
    <div class="meta-line"><span>Tracking No.</span><b>${escHtml(req.tracking_no)}</b></div>
    <div class="meta-line"><span>Project</span><b>${escHtml(req.project_name||"-")}</b></div>
    <div class="meta-line"><span>Location</span><b>${escHtml(req.project_location||"-")}</b></div>
    <div class="meta-line"><span>Requested by</span><b>${escHtml(req.request_by||"-")}</b></div>
    <div class="meta-line"><span>Form date</span><b>${escHtml(req.form_date||"-")}</b></div>
    <div class="meta-line"><span>Supply date needed</span><b>${escHtml(req.supply_date||"-")}</b></div>
    <table class="items-table">
      <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Total</th></tr></thead>
      <tbody>${itemRows || '<tr><td colspan="4" style="text-align:center;color:var(--muted)">No line items</td></tr>'}</tbody>
      <tfoot><tr><td colspan="3">Grand Total</td><td class="num">${money(req.grand_total)}</td></tr></tfoot>
    </table>
  `;

  card.innerHTML = `
    <div class="brand">SPACElogic</div>
    <div class="stage-tag">${escHtml(step.stage_name)}</div>
    <h1>E-Sign Approval</h1>
    ${fullFormHtml}
    ${identityHtml}
    <div class="actions">
      <button class="btn-approve" id="approveBtn" onclick="doApprove('${step.token}', ${isUnclaimed})">Approve &amp; Sign</button>
      <button class="btn-decline" onclick="toggleDeclinePanel()">Decline</button>
    </div>
    <div class="decline-panel" id="declinePanel">
      <label>Reason for declining</label>
      <input type="text" id="declineReason" placeholder="e.g. Budget not approved this quarter">
      <div class="actions">
        <button class="btn-decline" style="flex:1" onclick="doDecline('${step.token}', ${isUnclaimed})">Confirm Decline</button>
      </div>
    </div>
    <div class="msg" id="msg"></div>
  `;
}

function statusOnlyView(step, req, kind, html){
  return `
    <div class="brand">SPACElogic</div>
    <div class="stage-tag">${escHtml(step.stage_name)}</div>
    <h1>${escHtml(req.tracking_no)} — ${escHtml(req.project_name||"")}</h1>
    <div class="msg ${kind}" style="display:block">${html}</div>
    <div style="margin-top:16px;font-size:13px"><a href="dashboard.html" target="_blank">View full tracking dashboard →</a></div>
  `;
}

function toggleDeclinePanel(){
  const p=document.getElementById("declinePanel");
  p.style.display = p.style.display==="block" ? "none" : "block";
}

function toggleConfirmPin(){
  const nameInput = document.getElementById("nameInput");
  const wrap = document.getElementById("confirmPinWrap");
  const emailWrap = document.getElementById("newEmailWrap");
  if(!nameInput || !wrap) return;
  const name = nameInput.value.trim().toLowerCase();
  const isNew = name && !peopleCache.some(p=>p.name.toLowerCase()===name);
  wrap.style.display = isNew ? "block" : "none";
  if(emailWrap) emailWrap.style.display = isNew ? "block" : "none";
}

let justRegisteredNew = null; // {id, pin} — set only when this session created a brand-new account
let awaitingCodeFor = null; // email string, set once a code has been sent and we're waiting for it

async function ensureClaimed(tok, pin, msg){
  const nameInput = document.getElementById("nameInput");
  if(!nameInput) return true; // already claimed, nothing to do

  // Phase 2: a code was already sent — verify it now, then claim
  if(awaitingCodeFor){
    const code = (document.getElementById("regCodeInput")||{}).value?.trim() || "";
    if(!/^\d{6}$/.test(code)){ msg.className="msg error"; msg.style.display="block"; msg.textContent="Enter the 6-digit code from your email."; return false; }
    const {data: vData, error: vErr} = await supabaseClient.rpc("verify_registration", {p_email: awaitingCodeFor, p_code: code});
    if(vErr || !vData.success){ msg.className="msg error"; msg.style.display="block"; msg.textContent=(vData&&vData.error)||"Could not verify."; return false; }
    const personId = vData.id;
    awaitingCodeFor = null;
    justRegisteredNew = {id: personId, pin: pin};
    const {data: claimData, error: claimErr} = await supabaseClient.rpc("claim_step", {p_token: tok, p_person_id: personId, p_pin: pin});
    if(claimErr || !claimData.success){ msg.className="msg error"; msg.style.display="block"; msg.textContent=(claimData&&claimData.error)||"Could not claim this step."; return false; }
    return true;
  }

  const name = nameInput.value.trim();
  if(!name){ msg.className="msg error"; msg.style.display="block"; msg.textContent="Enter your name."; return false; }

  const existing = peopleCache.find(p=>p.name.toLowerCase()===name.toLowerCase());
  let personId = existing ? existing.id : null;

  if(!personId){
    // Phase 1: brand-new name — validate, send a code, then pause here
    const confirmPin = (document.getElementById("confirmPinInput")||{}).value?.trim() || "";
    const email = (document.getElementById("newEmailInput")||{}).value?.trim() || "";
    if(!/^[^@\s]+@spacelogic\.com\.sg$/i.test(email)){ msg.className="msg error"; msg.style.display="block"; msg.textContent="Enter your @spacelogic.com.sg company email."; return false; }
    if(!/^\d{4}$/.test(pin)){ msg.className="msg error"; msg.style.display="block"; msg.textContent="Choose a 4-digit PIN."; return false; }
    if(pin !== confirmPin){ msg.className="msg error"; msg.style.display="block"; msg.textContent="PINs don't match — re-enter both."; return false; }

    const {data: regData, error: regErr} = await supabaseClient.rpc("start_registration", {p_name: name, p_pin: pin, p_email: email});
    if(regErr || !regData.success){
      msg.className="msg error"; msg.style.display="block";
      msg.textContent = (regData&&regData.error) || (regErr&&regErr.message) || "Could not start registration.";
      return false;
    }
    const sent = await sendEmail(regData.email, regData.subject, regData.html);
    if(!sent){ msg.className="msg error"; msg.style.display="block"; msg.textContent="Could not send the verification email — try again."; return false; }

    awaitingCodeFor = regData.email;
    document.getElementById("codeWrap").style.display = "block";
    msg.className="msg success"; msg.style.display="block";
    msg.textContent = `Code sent to ${email}. Enter it above, then click Approve or Decline again.`;
    return false;
  }

  const {data: claimData, error: claimErr} = await supabaseClient.rpc("claim_step", {p_token: tok, p_person_id: personId, p_pin: pin});
  if(claimErr || !claimData.success){
    msg.className="msg error"; msg.style.display="block";
    msg.textContent = (claimData&&claimData.error) || (claimErr&&claimErr.message) || "Could not claim this step.";
    return false;
  }
  return true;
}

async function doApprove(tok, isUnclaimed){
  const pin=document.getElementById("pinInput").value.trim();
  const msg=document.getElementById("msg");
  if(!/^\d{4}$/.test(pin)){ msg.className="msg error"; msg.style.display="block"; msg.textContent="Enter your 4-digit PIN."; return; }
  document.getElementById("approveBtn").disabled=true;
  document.getElementById("approveBtn").textContent="Signing...";

  if(isUnclaimed){
    const claimed = await ensureClaimed(tok, pin, msg);
    if(!claimed){
      document.getElementById("approveBtn").disabled=false;
      document.getElementById("approveBtn").textContent="Approve & Sign";
      return;
    }
  }

  const {data, error} = await supabaseClient.rpc("sign_step", {p_token: tok, p_pin: pin});
  if(error || !data.success){
    msg.className="msg error"; msg.style.display="block";
    msg.textContent = (data && data.error) || (error && error.message) || "Something went wrong.";
    document.getElementById("approveBtn").disabled=false;
    document.getElementById("approveBtn").textContent="Approve & Sign";
    return;
  }

  if(data.stage === "Purchase"){
    sendNotification(data.signed_by_id, pin, data.requisition_id, "purchased");
  } else if(!data.next_token){
    sendNotification(data.signed_by_id, pin, data.requisition_id, "received");
  }

  let nextLinkHtml="";
  if(data.next_token){
    const nextUrl = new URL("sign.html", window.location.href);
    nextUrl.searchParams.set("token", data.next_token);
    nextLinkHtml = `
      <p style="margin-top:14px;font-size:13px">Send this link to whoever handles <b>${escHtml(data.next_stage)}</b> next.</p>
      <div class="link-copy-box">
        <input type="text" readonly value="${nextUrl.toString()}" id="nextLinkInput">
        <button type="button" onclick="copyNextLink()">Copy</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <input type="email" id="nextEmailInput" placeholder="Or type an email to send it instead" style="flex:1;font-size:12px;padding:7px 10px;border:1px solid var(--line);border-radius:8px">
        <button type="button" onclick="emailNextLink('${nextUrl.toString().replace(/'/g,"\\'")}', '${escHtml(data.next_stage).replace(/'/g,"\\'")}')">Send</button>
      </div>
      <div class="muted" id="nextEmailStatus" style="font-size:11px;margin-top:4px"></div>`;
  } else {
    nextLinkHtml = `<p style="margin-top:14px;font-size:13px">This was the final step — the requisition is now fully <b>Received</b>.</p>`;
  }

  card.innerHTML = `
    <div class="brand">SPACElogic</div>
    <div class="msg success" style="display:block">You signed off on <b>${escHtml(data.stage)}</b> as ${escHtml(data.signed_by)}.</div>
    ${nextLinkHtml}
    ${justRegisteredNew ? profileCompletionHtml() : ""}
    <div style="margin-top:16px;font-size:13px"><a href="dashboard.html" target="_blank">View full tracking dashboard →</a></div>
  `;
}
function copyNextLink(){
  const inp=document.getElementById("nextLinkInput");
  inp.select(); document.execCommand("copy");
}

async function emailNextLink(link, roleName){
  const email = document.getElementById("nextEmailInput").value.trim();
  const statusEl = document.getElementById("nextEmailStatus");
  if(!email){ statusEl.textContent="Enter an email address."; return; }
  statusEl.textContent="Sending...";
  try{
    const resp = await fetch(SEND_EMAIL_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json","Authorization":`Bearer ${SUPABASE_ANON_KEY}`,"apikey":SUPABASE_ANON_KEY},
      body: JSON.stringify({
        to: email,
        subject: `Action needed: please sign as ${roleName}`,
        html: `<p>You've been asked to review a purchase requisition as <b>${roleName}</b>.</p><p>Open this link to sign or decline: <a href="${link}">${link}</a></p>`
      })
    });
    const result = await resp.json();
    statusEl.textContent = result.success ? "Sent!" : (result.error || "Could not send.");
  }catch(e){ statusEl.textContent = "Could not send — check the address and try again."; }
}

async function doDecline(tok, isUnclaimed){
  const pin=document.getElementById("pinInput").value.trim();
  const reason=document.getElementById("declineReason").value.trim();
  const msg=document.getElementById("msg");
  if(!/^\d{4}$/.test(pin)){ msg.className="msg error"; msg.style.display="block"; msg.textContent="Enter your 4-digit PIN."; return; }
  if(!reason){ msg.className="msg error"; msg.style.display="block"; msg.textContent="Please give a short reason."; return; }

  if(isUnclaimed){
    const claimed = await ensureClaimed(tok, pin, msg);
    if(!claimed) return;
  }

  const {data, error} = await supabaseClient.rpc("decline_step", {p_token: tok, p_pin: pin, p_reason: reason});
  if(error || !data.success){
    msg.className="msg error"; msg.style.display="block";
    msg.textContent = (data && data.error) || (error && error.message) || "Something went wrong.";
    return;
  }
  sendNotification(data.declined_by_id, pin, data.requisition_id, "declined");
  card.innerHTML = `
    <div class="brand">SPACElogic</div>
    <div class="msg error" style="display:block">You declined this requisition at <b>${escHtml(data.stage)}</b>. The requester has been flagged on the dashboard.</div>
    ${justRegisteredNew ? profileCompletionHtml() : ""}
    <div style="margin-top:16px;font-size:13px"><a href="dashboard.html" target="_blank">View full tracking dashboard →</a></div>
  `;
}

function profileCompletionHtml(){
  return `
    <div id="profileCompletionBlock" style="margin-top:16px;border-top:1px dashed var(--line);padding-top:14px">
      <div style="font-size:12.5px;font-weight:700;margin-bottom:2px">You're all set up — want to add a bit more?</div>
      <div style="font-size:11.5px;color:var(--muted);margin-bottom:10px">Optional. Helps others know who they're dealing with.</div>
      <label style="font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px">Position</label>
      <input type="text" id="sigProfPosition" placeholder="e.g. Site Engineer" style="margin-bottom:8px">
      <label style="font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px">Team / Department</label>
      <input type="text" id="sigProfDepartment" placeholder="e.g. Operations" style="margin-bottom:10px">
      <div class="actions">
        <button class="btn-approve" onclick="saveSignerProfile()">Save</button>
        <button class="btn-decline" onclick="document.getElementById('profileCompletionBlock').style.display='none'">Skip</button>
      </div>
      <div class="msg" id="sigProfMsg" style="margin-top:8px"></div>
    </div>`;
}

async function saveSignerProfile(){
  if(!justRegisteredNew) return;
  const position = document.getElementById("sigProfPosition").value.trim();
  const department = document.getElementById("sigProfDepartment").value.trim();
  const msgEl = document.getElementById("sigProfMsg");
  const {data, error} = await supabaseClient.rpc("update_my_profile", {
    p_person_id: justRegisteredNew.id, p_pin: justRegisteredNew.pin,
    p_position: position, p_department: department, p_email: null
  });
  if(error || !data.success){ msgEl.className="msg error"; msgEl.style.display="block"; msgEl.textContent=(data&&data.error)||"Could not save."; return; }
  msgEl.className="msg success"; msgEl.style.display="block"; msgEl.textContent="Saved. Thanks!";
}

init();
</script>
</body>
</html>
